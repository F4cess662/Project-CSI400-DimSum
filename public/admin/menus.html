<!doctype html>
<!-- หน้าเมนูและหมวด (คนที่ 3 · เฟส 1 + Feedback เฟส 1 + เฟส 2 + Feedback เฟส 3)
     ใช้ Sidebar และ Topbar กลางจาก /assets/js/layout.js (initStaffPage) -->
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เมนูและหมวด · นึ่งสุข</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="app"></div>

  <template id="page">
    <div id="roleNotice" class="alert alert-wait hidden" style="margin-bottom:16px"></div>

    <div class="split" style="grid-template-columns: 300px 1fr; gap: 24px; align-items: start">
      <!-- ด้านซ้าย: การ์ดหมวดหมู่ (ออกแบบตามภาพต้นแบบ ไม่ตัดคำเป็นแนวตั้ง) -->
      <aside class="card" style="padding: 20px">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:16px">
          <h3 class="h3" style="margin:0">หมวด</h3>
          <button type="button" class="btn btn-sm" id="addCategoryBtn">+ เพิ่มหมวด</button>
        </div>

        <div id="categoryList" style="display:flex; flex-direction:column; gap:4px">
          <div class="loading">กำลังโหลด...</div>
        </div>

        <div class="caption muted" id="catHint" style="margin-top:16px; padding-top:12px; border-top:1px solid var(--cream-300)">
          ลากที่ไอคอน ⋮⋮ เพื่อเรียงลำดับหมวด
        </div>
      </aside>

      <!-- ด้านขวา: แถบค้นหา + กรองราคา + ชิปโซนครัว + การ์ดเมนู -->
      <section style="min-width:0">
        <!-- แถวบน: ช่องค้นหา + ช่วงราคา + ปุ่มเพิ่มเมนู (เรียงบรรทัดเดียวสวยงาม) -->
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px">
          <div style="position:relative; flex:1; min-width:200px">
            <span style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--brown-500); display:flex; pointer-events:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input
              type="search"
              class="input"
              id="searchInput"
              style="padding-left:40px"
              placeholder="ค้นหาชื่อเมนู / ไส้ / คำอธิบาย..."
            >
          </div>

          <input
            type="number"
            class="input"
            id="minPriceInput"
            min="0"
            step="1"
            style="width:104px; padding:0 10px"
            placeholder="ราคาต่ำสุด"
          >
          <span class="muted">–</span>
          <input
            type="number"
            class="input"
            id="maxPriceInput"
            min="0"
            step="1"
            style="width:104px; padding:0 10px"
            placeholder="ราคาสูงสุด"
          >
          <button type="button" class="btn btn-secondary btn-sm" id="clearFilterBtn" style="height:44px; padding:0 12px">ล้าง</button>
          <button type="button" class="btn" id="addMenuBtn">+ เพิ่มเมนู</button>
        </div>

        <!-- แถวชิปกรองโซนครัว (Feedback #4: โจ๊ก-เส้น → จานหลัก) -->
        <div class="row" id="zoneFilterBar" style="gap:8px; margin-bottom:16px">
          <button type="button" class="chip active" data-zone="all">ทุกโซน</button>
          <button type="button" class="chip zone-steam" data-zone="steam"><span class="zone-dot"></span>นึ่ง</button>
          <button type="button" class="chip zone-fry" data-zone="fry"><span class="zone-dot"></span>ทอด</button>
          <button type="button" class="chip zone-congee_noodle" data-zone="congee_noodle"><span class="zone-dot"></span>จานหลัก</button>
          <button type="button" class="chip zone-drink_dessert" data-zone="drink_dessert"><span class="zone-dot"></span>เครื่องดื่ม</button>
        </div>

        <!-- Grid การ์ดเมนู -->
        <div id="menuGrid" class="grid grid-3" style="gap:16px">
          <div class="loading" style="grid-column: 1 / -1">กำลังโหลดรายการเมนู...</div>
        </div>
      </section>
    </div>
  </template>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    (async () => {
      const me = await initStaffPage({
        title: 'เมนูและหมวด',
        roles: ['head_chef', 'manager', 'owner'],
      });
      if (!me) return;

      const isOwner = me.role_code === 'owner';
      const UNITS = ['เข่ง', 'ลูก', 'ชิ้น', 'ที่', 'จาน', 'ชาม', 'หม้อ', 'ชุด', 'แก้ว', 'ถ้วย', 'กา'];
      const ZONE_LIST = [
        { code: 'steam', label: 'นึ่ง' },
        { code: 'fry', label: 'ทอด' },
        { code: 'congee_noodle', label: 'จานหลัก' },
        { code: 'drink_dessert', label: 'เครื่องดื่ม-ของหวาน' },
      ];

      // SVG ไอคอนเส้นสะอาดแบบ Lucide
      const SVG = {
        grip: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>',
        edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>',
        hide: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>',
        trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>',
      };

      function getCatEmoji(name = '') {
        const s = String(name);
        if (s.includes('ทอด')) return '<i data-icon="flame"></i>';
        if (s.includes('จานหลัก') || s.includes('โจ๊ก') || s.includes('เส้น') || s.includes('หมี่')) return '<i data-icon="bowl"></i>';
        if (s.includes('เครื่องดื่ม') || s.includes('ชา') || s.includes('น้ำ')) return '<i data-icon="cup"></i>';
        if (s.includes('หวาน') || s.includes('เซ็ต')) return '<i data-icon="cup"></i>';
        return '<i data-icon="dumpling"></i>';
      }

      let categories = [];
      let allMenusCount = 0;
      let menus = [];
      let selectedCategoryId = 'all';
      let selectedZone = 'all';
      let searchTimer = null;
      let draggedCatIdx = null;

      const roleNoticeEl = document.getElementById('roleNotice');
      const addCategoryBtn = document.getElementById('addCategoryBtn');
      const addMenuBtn = document.getElementById('addMenuBtn');
      const catHintEl = document.getElementById('catHint');
      const categoryListEl = document.getElementById('categoryList');
      const menuGridEl = document.getElementById('menuGrid');
      const searchInput = document.getElementById('searchInput');
      const minPriceInput = document.getElementById('minPriceInput');
      const maxPriceInput = document.getElementById('maxPriceInput');
      const clearFilterBtn = document.getElementById('clearFilterBtn');
      const zoneFilterBar = document.getElementById('zoneFilterBar');

      if (!isOwner) {
        addCategoryBtn.classList.add('hidden');
        addMenuBtn.classList.add('hidden');
        catHintEl.classList.add('hidden');
        roleNoticeEl.classList.remove('hidden');
        roleNoticeEl.textContent = `โหมด${ROLES[me.role_code] || me.role_code}: สามารถเปิด/ปิดขาย เติม +1 ล็อต หรือกรอกจำนวนคงเหลือได้ (การเพิ่ม/แก้ไข/ลบหมวดและเมนูสำหรับเจ้าของร้านเท่านั้น)`;
      }

      async function loadCategories() {
        const rows = await run(() => api.get('categories'));
        if (!rows) return;
        categories = rows;
        allMenusCount = categories.reduce((sum, c) => sum + Number(c.menu_count || 0), 0);
        renderCategories();
      }

      async function loadMenus() {
        const params = {
          q: searchInput.value.trim(),
          category_id: selectedCategoryId === 'all' ? '' : selectedCategoryId,
          kitchen_zone: selectedZone === 'all' ? '' : selectedZone,
          min_price: minPriceInput.value.trim(),
          max_price: maxPriceInput.value.trim(),
        };
        const rows = await run(() => api.get('menus', params));
        if (!rows) return;
        menus = rows;
        renderMenus();
      }

      function renderCategories() {
        const allActive = selectedCategoryId === 'all';
        const html = [
          `<button
             type="button"
             data-cat="all"
             style="width:100%; height:44px; padding:0 14px; border-radius:12px; border:0; display:flex; align-items:center; justify-content:space-between; cursor:pointer; font:600 16px 'Sarabun',sans-serif; background:${allActive ? 'var(--red-50)' : 'transparent'}; color:${allActive ? 'var(--red-600)' : 'var(--brown-900)'}; margin-bottom:4px"
           >
             <span>ทั้งหมด</span>
             <span style="font-size:14px; font-weight:600; color:${allActive ? 'var(--red-600)' : 'var(--brown-500)'}">${fmt.num(allMenusCount)}</span>
           </button>`,
          ...categories.map((cat, idx) => {
            const active = String(selectedCategoryId) === String(cat.id);
            const emoji = getCatEmoji(cat.name);
            return `
              <div
                class="cat-item"
                draggable="${isOwner ? 'true' : 'false'}"
                data-cat-idx="${idx}"
                style="height:42px; padding:0 8px; border-radius:12px; display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:nowrap; background:${active ? 'var(--red-50)' : 'transparent'}; transition:background .15s"
              >
                <div style="display:flex; align-items:center; gap:8px; min-width:0; flex:1">
                  ${isOwner ? `
                    <span
                      style="color:var(--brown-500); cursor:grab; display:inline-flex; align-items:center; flex:none"
                      title="ลากเพื่อเรียงลำดับหมวด"
                    >${SVG.grip}</span>
                  ` : ''}
                  <button
                    type="button"
                    data-cat="${cat.id}"
                    style="display:flex; align-items:center; gap:8px; min-width:0; flex:1; border:0; background:transparent; padding:0; cursor:pointer; text-align:left; font:${active ? '600' : '400'} 16px 'Sarabun',sans-serif; color:${active ? 'var(--red-600)' : 'var(--brown-900)'}"
                  >
                    <span style="font-size:18px; line-height:1; flex:none">${emoji}</span>
                    <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${fmt.esc(cat.name)}</span>
                  </button>
                </div>

                <div style="display:flex; align-items:center; gap:2px; flex:none">
                  <span style="font-size:14px; font-weight:${active ? '600' : '400'}; color:${active ? 'var(--red-600)' : 'var(--brown-500)'}; min-width:22px; text-align:right; margin-right:4px">
                    ${fmt.num(cat.menu_count || 0)}
                  </span>
                  ${isOwner ? `
                    <button
                      type="button"
                      data-cat-edit="${cat.id}"
                      style="width:28px; height:28px; border-radius:8px; border:0; background:transparent; color:var(--brown-500); display:inline-flex; align-items:center; justify-content:center; cursor:pointer"
                      title="แก้ไขหมวด ${fmt.esc(cat.name)}"
                    >${SVG.edit}</button>
                    <button
                      type="button"
                      data-cat-del="${cat.id}"
                      style="width:28px; height:28px; border-radius:8px; border:0; background:transparent; color:var(--brown-500); display:inline-flex; align-items:center; justify-content:center; cursor:pointer"
                      title="ซ่อนหมวด ${fmt.esc(cat.name)}"
                    >${SVG.hide}</button>
                  ` : ''}
                </div>
              </div>
            `;
          }),
        ].join('');
        categoryListEl.innerHTML = html;

        if (isOwner) {
          categoryListEl.querySelectorAll('.cat-item').forEach((row) => {
            row.ondragstart = (e) => {
              draggedCatIdx = Number(row.dataset.catIdx);
              row.style.opacity = '0.5';
              if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
            };
            row.ondragend = () => {
              draggedCatIdx = null;
              row.style.opacity = '1';
            };
            row.ondragover = (e) => {
              e.preventDefault();
              row.style.background = 'var(--cream-200)';
            };
            row.ondragleave = () => {
              const idx = Number(row.dataset.catIdx);
              const cat = categories[idx];
              const active = cat && String(selectedCategoryId) === String(cat.id);
              row.style.background = active ? 'var(--red-50)' : 'transparent';
            };
            row.ondrop = async (e) => {
              e.preventDefault();
              const targetIdx = Number(row.dataset.catIdx);
              if (draggedCatIdx === null || draggedCatIdx === targetIdx) return;
              const reordered = [...categories];
              const [moved] = reordered.splice(draggedCatIdx, 1);
              reordered.splice(targetIdx, 0, moved);
              categories = reordered;
              renderCategories();
              await run(() => api.post('categories', {
                action: 'reorder',
                ids: categories.map((c) => c.id),
              }));
              await loadCategories();
              await loadMenus();
            };
          });
        }
      }

      function renderMenus() {
        if (!menus.length) {
          menuGridEl.innerHTML = `
            <div class="card empty" style="grid-column: 1 / -1">
              <div class="empty-icon"><i data-icon="dumpling"></i></div>
              <div>ไม่พบรายการเมนูที่ตรงกับเงื่อนไขการค้นหา</div>
            </div>`;
          return;
        }

        menuGridEl.innerHTML = menus.map((m) => {
          const qty = m.available_qty !== null && m.available_qty !== undefined ? Number(m.available_qty) : 0;
          const lotSize = Number(m.lot_size || 1);
          const isSoldOut = !m.is_available; // หมด = ปิดขาย
          const isTempOut = !isSoldOut && m.available_qty != null && qty <= 0; // หมดชั่วคราว ยังสั่งได้
          const isLow = !isSoldOut && !isTempOut && qty <= lotSize;
          const unitText = fmt.esc(m.unit || 'เข่ง');

          let stockBadge = `<span class="badge badge-ok">คงเหลือ ${fmt.num(qty)} ${unitText}</span>`;
          if (isSoldOut || isTempOut) {
            stockBadge = isSoldOut ? `<span class="badge badge-bad">หมด (ปิดขาย)</span>` : `<span class="badge badge-wait">หมดชั่วคราว (0 ${unitText})</span>`;
          } else if (isLow) {
            stockBadge = `<span class="badge badge-wait">ใกล้หมด ${fmt.num(qty)} ${unitText}</span>`;
          }

          return `
            <article class="menu-card zone-${fmt.esc(m.kitchen_zone)} zone-border ${isSoldOut ? 'soldout' : ''}" style="padding:16px">
              <div class="menu-img" style="margin:0 0 12px 0">
                ${menuImage(m)}
                ${isSoldOut ? badge('soldout', 'หมด') : isTempOut ? badge('temp_out') : ''}
              </div>

              <div class="menu-body" style="padding:0">
                <!-- ชื่อเมนู + ชิปโซนครัว -->
                <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:2px">
                  <div class="menu-name" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${fmt.esc(m.name)}</div>
                  <span class="badge badge-off" style="color:var(--brown-900); font-weight:400; flex:none">
                    ${zoneChip(m.kitchen_zone)}
                  </span>
                </div>

                <!-- คำอธิบาย -->
                <div class="menu-desc" style="margin-bottom:10px">${fmt.esc(m.description || m.category_name || 'เมนูติ่มซำทำสดใหม่ทุกวัน')}</div>

                <!-- แถวราคา/หน่วย และขนาดล็อต (Feedback #7: ใช้ fmt.baht แทน ฿) -->
                <div style="display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding-bottom:10px; border-bottom:1.5px solid var(--cream-300)">
                  <div>
                    <span class="price">${fmt.baht(m.price)}</span>
                    <span class="small muted"> / ${unitText}</span>
                  </div>
                  <span class="caption muted">1 ล็อต = ${fmt.num(lotSize)} ${unitText}</span>
                </div>

                <!-- แถวจัดการจำนวนพร้อมขาย (+1 ล็อต / กรอกเอง) -->
                <div style="display:flex; align-items:center; justify-content:space-between; gap:6px; padding:10px 0; border-bottom:1.5px solid var(--cream-300)">
                  ${stockBadge}
                  <div style="display:flex; align-items:center; gap:4px; flex:none">
                    <button
                      type="button"
                      class="btn btn-secondary btn-sm"
                      data-add-lot="${m.id}"
                      style="height:28px; padding:0 8px; font-size:12px"
                      title="เติม +1 ล็อต (+${lotSize} ${unitText})"
                    >+1 ล็อต</button>
                    <button
                      type="button"
                      class="btn btn-secondary btn-sm"
                      data-set-stock="${m.id}"
                      style="height:28px; padding:0 8px; font-size:12px"
                      title="กรอกจำนวนคงเหลือเอง (${unitText})"
                    >กรอกเอง</button>
                  </div>
                </div>

                <!-- แถวล่าง: สวิตช์เปิดขาย + ปุ่มแก้ไข/ลบไอคอนสะอาด -->
                <div style="display:flex; align-items:center; justify-content:space-between; padding-top:10px">
                  <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:14px; font-weight:600">
                    <span class="switch">
                      <input type="checkbox" data-toggle-avail="${m.id}" ${m.is_available ? 'checked' : ''}>
                      <span></span>
                    </span>
                    <span>เปิดขาย</span>
                  </label>

                  ${isOwner ? `
                    <div style="display:flex; align-items:center; gap:4px">
                      <button
                        type="button"
                        data-edit-menu="${m.id}"
                        style="width:32px; height:32px; border-radius:8px; border:0; background:transparent; color:var(--brown-500); display:inline-flex; align-items:center; justify-content:center; cursor:pointer"
                        title="แก้ไขเมนู ${fmt.esc(m.name)}"
                      >${SVG.edit}</button>
                      <button
                        type="button"
                        data-del-menu="${m.id}"
                        style="width:32px; height:32px; border-radius:8px; border:0; background:transparent; color:var(--brown-500); display:inline-flex; align-items:center; justify-content:center; cursor:pointer"
                        title="ลบเมนู ${fmt.esc(m.name)}"
                      >${SVG.trash}</button>
                    </div>
                  ` : ''}
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

      /* ---------- Modal หมวดหมู่ ---------- */
      function openCategoryModal(cat = null) {
        const isEdit = Boolean(cat);
        const m = openModal({
          title: isEdit ? 'แก้ไขหมวดหมู่' : 'เพิ่มหมวดหมู่ใหม่',
          body: `
            <form id="catForm">
              <div class="field">
                <label for="catName">ชื่อหมวดหมู่</label>
                <input class="input" id="catName" name="name" required maxlength="100" value="${fmt.esc(cat ? cat.name : '')}" placeholder="เช่น ซาลาเปา">
              </div>
              ${isEdit ? `
                <div class="field">
                  <label for="catSort">ลำดับการแสดงผล (ตัวเลขน้อยอยู่บน)</label>
                  <input class="input" type="number" id="catSort" name="sort_order" min="1" step="1" value="${Number(cat.sort_order || 1)}">
                </div>
              ` : ''}
            </form>`,
          footer: `
            <button type="button" class="btn btn-secondary" data-close>ยกเลิก</button>
            <button type="submit" class="btn" form="catForm">ยืนยัน</button>`,
        });

        m.el.querySelector('#catForm').onsubmit = async (e) => {
          e.preventDefault();
          const name = m.el.querySelector('#catName').value.trim();
          const sortEl = m.el.querySelector('#catSort');
          if (!name) return;
          const payload = isEdit
            ? { action: 'update', id: cat.id, name, sort_order: sortEl ? Number(sortEl.value) : cat.sort_order }
            : { action: 'create', name };
          const res = await run(() => api.post('categories', payload));
          if (res) {
            m.close();
            await loadCategories();
            await loadMenus();
          }
        };
      }

      /* ---------- Modal เพิ่ม/แก้ไขเมนู (640px modal-lg + กันชื่อซ้ำ/คล้าย Feedback #3) ---------- */
      function openMenuModal(item = null) {
        const isEdit = Boolean(item);
        const defaultCatId = item
          ? item.category_id
          : (selectedCategoryId !== 'all' ? selectedCategoryId : (categories[0] && categories[0].id));
        const currentUnit = item ? item.unit : 'เข่ง';
        const currentZone = item ? item.kitchen_zone : 'steam';
        const unitOptions = UNITS.includes(currentUnit) ? UNITS : [currentUnit, ...UNITS];

        const m = openModal({
          title: isEdit ? `แก้ไขเมนู: ${fmt.esc(item.name)}` : 'เพิ่มเมนูใหม่',
          size: 'lg',
          body: `
            <form id="menuForm" enctype="multipart/form-data">
              <div class="grid grid-2">
                <div class="field">
                  <label>รูปเมนู (อัตราส่วน 4:3 · ไม่เกิน 2MB)</label>
                  <div class="menu-img" id="imgPreviewBox" style="margin:0">
                    ${item ? menuImage(item) : '<i data-icon="dumpling"></i>'}
                  </div>
                  <input class="input" type="file" id="menuImgInput" name="image" accept="image/*" style="padding-top:8px">
                </div>

                <div>
                  <div class="field">
                    <label for="menuCat">หมวดหมู่</label>
                    <select class="select" id="menuCat" name="category_id" required>
                      ${categories.map((c) => `<option value="${c.id}" ${String(c.id) === String(defaultCatId) ? 'selected' : ''}>${fmt.esc(c.name)}</option>`).join('')}
                    </select>
                  </div>
                  <div class="field">
                    <label for="menuName">ชื่อเมนู</label>
                    <input class="input" id="menuName" name="name" required maxlength="100" value="${fmt.esc(item ? item.name : '')}" placeholder="เช่น ฮะเก๋ากุ้ง">
                  </div>
                  <div class="field">
                    <label for="menuDesc">คำอธิบาย</label>
                    <input class="input" id="menuDesc" name="description" maxlength="255" value="${fmt.esc(item && item.description ? item.description : '')}" placeholder="เช่น เข่งละ 3–4 ชิ้น">
                  </div>
                </div>
              </div>

              <div class="grid grid-3">
                <div class="field">
                  <label for="menuPrice">ราคา (บาท)</label>
                  <input class="input" type="number" id="menuPrice" name="price" min="1" step="0.01" required value="${item ? Number(item.price) : 45}">
                  <div class="caption text-red hidden" id="priceLogHint">* การแก้ราคาจะถูกบันทึก log ระดับ system</div>
                </div>

                <div class="field">
                  <label for="menuUnit">หน่วย</label>
                  <select class="select" id="menuUnit" name="unit">
                    ${unitOptions.map((u) => `<option value="${fmt.esc(u)}" ${u === currentUnit ? 'selected' : ''}>${fmt.esc(u)}</option>`).join('')}
                  </select>
                </div>

                <div class="field">
                  <label for="menuLotSize" id="lotSizeLabel">ขนาดล็อต (1 ล็อต = ${item ? item.lot_size : 5} ${fmt.esc(currentUnit)})</label>
                  <input class="input" type="number" id="menuLotSize" name="lot_size" min="1" step="1" required value="${item ? Number(item.lot_size) : 5}">
                </div>
              </div>

              ${!isEdit ? `
                <div class="field">
                  <label for="menuInitQty">จำนวนพร้อมขายเริ่มต้น</label>
                  <input class="input" type="number" id="menuInitQty" name="available_qty" min="0" step="1" value="30">
                </div>
              ` : ''}

              <div class="field">
                <label>โซนครัว (4 โซน)</label>
                <input type="hidden" id="menuZoneInput" name="kitchen_zone" value="${fmt.esc(currentZone)}">
                <div class="grid grid-4" id="zonePicker">
                  ${ZONE_LIST.map((z) => `
                    <button type="button" class="chip zone-${z.code} ${z.code === currentZone ? 'active' : ''}" data-pick-zone="${z.code}" style="justify-content:center; height:40px">
                      <span class="zone-dot"></span>${z.label}
                    </button>
                  `).join('')}
                </div>
              </div>
            </form>`,
          footer: `
            <button type="button" class="btn btn-secondary" data-close>ยกเลิก</button>
            <button type="submit" class="btn" form="menuForm">ยืนยัน</button>`,
        });

        const priceInput = m.el.querySelector('#menuPrice');
        const priceLogHint = m.el.querySelector('#priceLogHint');
        const unitSelect = m.el.querySelector('#menuUnit');
        const lotInput = m.el.querySelector('#menuLotSize');
        const lotLabel = m.el.querySelector('#lotSizeLabel');
        const imgInput = m.el.querySelector('#menuImgInput');
        const imgPreviewBox = m.el.querySelector('#imgPreviewBox');
        const zoneInput = m.el.querySelector('#menuZoneInput');

        if (isEdit) {
          priceInput.oninput = () => {
            const changed = Number(priceInput.value) !== Number(item.price);
            priceLogHint.classList.toggle('hidden', !changed);
          };
        }

        const updateLotLabel = () => {
          lotLabel.textContent = `ขนาดล็อต (1 ล็อต = ${lotInput.value || 1} ${unitSelect.value})`;
        };
        unitSelect.onchange = updateLotLabel;
        lotInput.oninput = updateLotLabel;

        imgInput.onchange = () => {
          const f = imgInput.files && imgInput.files[0];
          if (!f) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            imgPreviewBox.innerHTML = `<img src="${ev.target.result}" alt="พรีวิว">`;
          };
          reader.readAsDataURL(f);
        };

        m.el.querySelector('#zonePicker').onclick = (e) => {
          const btn = e.target.closest('[data-pick-zone]');
          if (!btn) return;
          const z = btn.dataset.pickZone;
          zoneInput.value = z;
          m.el.querySelectorAll('[data-pick-zone]').forEach((el) => {
            el.classList.toggle('active', el.dataset.pickZone === z);
          });
        };

        m.el.querySelector('#menuForm').onsubmit = async (e) => {
          e.preventDefault();
          const formEl = e.target;
          const makeFormData = (confirmSimilar = false) => {
            const fd = new FormData(formEl);
            fd.append('action', isEdit ? 'update' : 'create');
            if (isEdit) fd.append('id', String(item.id));
            if (confirmSimilar) fd.append('confirm_similar', '1');
            return fd;
          };

          try {
            const res = await api.upload('menus', makeFormData(false));
            if (api.lastMessage) toast(api.lastMessage);
            if (res) {
              m.close();
              await loadCategories();
              await loadMenus();
            }
          } catch (err) {
            if (err && err.data && err.data.need_confirm) {
              const simName = fmt.esc(err.data.similar || '');
              const yes = await confirmModal(
                `มีเมนูชื่อคล้าย: <b>${simName}</b> ยืนยันว่าเป็นคนละเมนู?`,
                'ยืนยันบันทึก',
                false
              );
              if (yes) {
                const res2 = await run(() => api.upload('menus', makeFormData(true)));
                if (res2) {
                  m.close();
                  await loadCategories();
                  await loadMenus();
                }
              }
              return;
            }
            toast((err && err.message) || 'เกิดข้อผิดพลาด', 'error');
          }
        };
      }

      /* ---------- Modal กรอกจำนวนคงเหลือเอง ---------- */
      function openSetStockModal(item) {
        const unit = fmt.esc(item.unit || 'เข่ง');
        const currentQty = Number(item.available_qty || 0);
        const m = openModal({
          title: `ปรับจำนวนพร้อมขาย: ${fmt.esc(item.name)}`,
          body: `
            <form id="stockForm">
              <div class="field">
                <label for="stockQtyInput">จำนวนคงเหลือจริง (${unit})</label>
                <input class="input" type="number" id="stockQtyInput" min="0" step="1" required value="${currentQty}">
                <div class="caption muted">
                  1 ล็อต = ${fmt.num(item.lot_size)} ${unit} · ใส่ <strong>0</strong> = หมดชั่วคราว (ลูกค้ายังสั่งได้ รอนานขึ้น) · ถ้าจะหยุดขายให้กดสวิตช์ปิดขาย
                </div>
              </div>
            </form>`,
          footer: `
            <button type="button" class="btn btn-secondary" data-close>ยกเลิก</button>
            <button type="submit" class="btn" form="stockForm">บันทึกจำนวน</button>`,
        });

        m.el.querySelector('#stockForm').onsubmit = async (e) => {
          e.preventDefault();
          const val = Number(m.el.querySelector('#stockQtyInput').value);
          const res = await run(() => api.post('menus', {
            action: 'set_stock',
            id: item.id,
            available_qty: val,
          }));
          if (res) {
            m.close();
            await loadMenus();
          }
        };
      }

      /* ---------- Event Listeners ---------- */
      addCategoryBtn.onclick = () => openCategoryModal();
      addMenuBtn.onclick = () => openMenuModal();

      const triggerFilter = () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(loadMenus, 300);
      };
      searchInput.oninput = triggerFilter;
      minPriceInput.oninput = triggerFilter;
      maxPriceInput.oninput = triggerFilter;

      clearFilterBtn.onclick = () => {
        searchInput.value = '';
        minPriceInput.value = '';
        maxPriceInput.value = '';
        selectedCategoryId = 'all';
        selectedZone = 'all';
        zoneFilterBar.querySelectorAll('[data-zone]').forEach((el) => {
          el.classList.toggle('active', el.dataset.zone === 'all');
        });
        renderCategories();
        loadMenus();
      };

      zoneFilterBar.onclick = (e) => {
        const btn = e.target.closest('[data-zone]');
        if (!btn) return;
        selectedZone = btn.dataset.zone;
        zoneFilterBar.querySelectorAll('[data-zone]').forEach((el) => {
          el.classList.toggle('active', el.dataset.zone === selectedZone);
        });
        loadMenus();
      };

      categoryListEl.onclick = async (e) => {
        const editBtn = e.target.closest('[data-cat-edit]');
        if (editBtn) {
          const cat = categories.find((c) => String(c.id) === String(editBtn.dataset.catEdit));
          if (cat) openCategoryModal(cat);
          return;
        }

        const delBtn = e.target.closest('[data-cat-del]');
        if (delBtn) {
          const cat = categories.find((c) => String(c.id) === String(delBtn.dataset.catDel));
          if (!cat) return;
          if (Number(cat.menu_count || 0) > 0) {
            toast(`ซ่อนหมวด "${cat.name}" ไม่ได้ เนื่องจากยังมีเมนูในหมวดนี้อยู่ ${cat.menu_count} รายการ`, 'error');
            return;
          }
          if (await confirmModal(`ต้องการซ่อนหมวดหมู่ "${fmt.esc(cat.name)}" หรือไม่?`, 'ซ่อนหมวด', true)) {
            const res = await run(() => api.post('categories', { action: 'delete', id: cat.id }));
            if (res) {
              if (String(selectedCategoryId) === String(cat.id)) selectedCategoryId = 'all';
              await loadCategories();
              await loadMenus();
            }
          }
          return;
        }

        const catBtn = e.target.closest('[data-cat]');
        if (catBtn) {
          selectedCategoryId = catBtn.dataset.cat;
          renderCategories();
          await loadMenus();
        }
      };

      menuGridEl.onclick = async (e) => {
        const addLotBtn = e.target.closest('[data-add-lot]');
        if (addLotBtn) {
          const id = Number(addLotBtn.dataset.addLot);
          const res = await run(() => api.post('menus', { action: 'add_stock', id, lots: 1 }));
          if (res) await loadMenus();
          return;
        }

        const setStockBtn = e.target.closest('[data-set-stock]');
        if (setStockBtn) {
          const item = menus.find((m) => Number(m.id) === Number(setStockBtn.dataset.setStock));
          if (item) openSetStockModal(item);
          return;
        }

        const editBtn = e.target.closest('[data-edit-menu]');
        if (editBtn) {
          const item = menus.find((m) => Number(m.id) === Number(editBtn.dataset.editMenu));
          if (item) openMenuModal(item);
          return;
        }

        const delBtn = e.target.closest('[data-del-menu]');
        if (delBtn) {
          const item = menus.find((m) => Number(m.id) === Number(delBtn.dataset.delMenu));
          if (!item) return;
          if (await confirmModal(`ยืนยันการลบเมนู "${fmt.esc(item.name)}" (${fmt.baht(item.price)} / ${fmt.esc(item.unit)})?`, 'ลบเมนู', true)) {
            const res = await run(() => api.post('menus', { action: 'delete', id: item.id }));
            if (res) {
              await loadCategories();
              await loadMenus();
            }
          }
        }
      };

      menuGridEl.onchange = async (e) => {
        const toggle = e.target.closest('[data-toggle-avail]');
        if (!toggle) return;
        const id = Number(toggle.dataset.toggleAvail);
        const isAvailable = toggle.checked ? 1 : 0;
        const menu = menus.find((x) => Number(x.id) === id);
        const name = menu ? fmt.esc(menu.name) : 'เมนูนี้';
        const yes = await confirmModal(isAvailable
          ? `เปิดขาย <b>${name}</b>?<br><span class="small muted">ลูกค้าจะเห็นและสั่งเมนูนี้ได้</span>`
          : `ปิดขาย <b>${name}</b>?<br><span class="small muted">ลูกค้าจะเห็นเมนูนี้เป็น "หมด" และสั่งไม่ได้</span>`,
          isAvailable ? 'เปิดขาย' : 'ปิดขาย', !isAvailable);
        if (!yes) { toggle.checked = !toggle.checked; return; }
        const res = await run(() => api.post('menus', { action: 'set_available', id, is_available: isAvailable }));
        await loadMenus();
        if (!res) toggle.checked = !toggle.checked;
      };

      await loadCategories();
      await loadMenus();
    })();
  </script>
</body>
</html>
