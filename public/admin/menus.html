<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>นิ่งสุข — ระบบจัดการร้านติ่มซำ (เมนูและหมวด)</title>
  <!-- Google Fonts: Mitr (500) & Sarabun (400, 600) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500&family=Sarabun:wght@400;600&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    /* =========================================================================
       tailwind.config.js — Design Tokens ร้าน "นิ่งสุข" (ตรงตามพิมพ์เขียวทุกค่า)
       ========================================================================= */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: {
              50: 'var(--cream-50)',
              100: 'var(--cream-100)',
              200: 'var(--cream-200)',
              300: 'var(--cream-300)',
            },
            bamboo: 'var(--bamboo)',
            red: {
              50: 'var(--red-50)',
              600: 'var(--red-600)',
              700: 'var(--red-700)',
            },
            gold: 'var(--gold)',
            brown: {
              500: 'var(--brown-500)',
              900: 'var(--brown-900)',
            },
            white: 'var(--white)',
            status: {
              'success-bg': 'var(--status-success-bg)',
              'success-text': 'var(--status-success-text)',
              'warning-bg': 'var(--status-warning-bg)',
              'warning-text': 'var(--status-warning-text)',
              'info-bg': 'var(--status-info-bg)',
              'info-text': 'var(--status-info-text)',
              'danger-bg': 'var(--status-danger-bg)',
              'danger-text': 'var(--status-danger-text)',
              'disabled-bg': 'var(--status-disabled-bg)',
              'disabled-text': 'var(--status-disabled-text)',
            },
            zone: {
              steam: 'var(--zone-steam)',
              fry: 'var(--zone-fry)',
              congee: 'var(--zone-congee)',
              drink: 'var(--zone-drink)',
            }
          },
          fontFamily: {
            heading: ['Mitr', 'sans-serif'],
            body: ['Sarabun', 'sans-serif'],
          },
          spacing: {
            '1': 'var(--space-4)',
            '2': 'var(--space-8)',
            '3': 'var(--space-12)',
            '4': 'var(--space-16)',
            '5': 'var(--space-20)',
            '6': 'var(--space-24)',
            '8': 'var(--space-32)',
            '12': 'var(--space-48)',
          },
          borderRadius: {
            'control': 'var(--radius-control)',
            'card': 'var(--radius-card)',
            'modal': 'var(--radius-modal)',
            'pill': 'var(--radius-pill)',
          },
          boxShadow: {
            'sticker': 'var(--shadow-sticker)',
            'primary': 'var(--shadow-primary)',
            'modal': 'var(--shadow-modal)',
            'sticky-up': 'var(--shadow-sticky-up)',
          }
        }
      }
    };
  </script>
  <style id="index-css">
    /* =========================================================================
       index.css — Design Tokens ร้าน "นิ่งสุข" (ห้ามดัดแปลงค่าตัวเลขและรหัสสี)
       ========================================================================= */
    :root {
      /* 2. สี (ใช้เท่านี้) */
      --cream-50: #FFFBF3;   /* พื้นการ์ด / sidebar / navbar */
      --cream-100: #FCF3E3;  /* พื้นหลังหน้า (body) */
      --cream-200: #F6E6C8;  /* พื้นรอง / hover / แถวตารางสลับ / ช่อง input disabled */
      --cream-300: #EBD3A8;  /* เส้นขอบทุกชนิด */
      --bamboo: #D9A961;     /* สีเข่งไผ่ ใช้ตกแต่งเล็กน้อย (เส้นคั่น ไอคอนรอง) */
      --red-600: #C8322F;    /* สีหลักแบรนด์: ปุ่มหลัก ลิงก์ เมนูที่เลือก โลโก้ตัวอักษร */
      --red-700: #A52624;    /* hover / pressed ของปุ่มแดง */
      --red-50: #FBE7E2;     /* พื้นของสิ่งที่ถูกเลือก / badge แดงอ่อน */
      --gold: #F2B83B;       /* แต้ม ราคาเด่น ดาว โปรโมชัน */
      --brown-900: #4A2C22;  /* ตัวอักษรหลัก */
      --brown-500: #8A6E5E;  /* ตัวอักษรรอง / placeholder */
      --white: #FFFFFF;      /* ตัวอักษรบนปุ่มแดง */

      /* สถานะ (ใช้เป็นพื้นอ่อน + ตัวอักษรเข้มเสมอ) */
      --status-success-bg: #E3F2E6;
      --status-success-text: #2E7D4F;
      --status-warning-bg: #FFF1CC;
      --status-warning-text: #9A6B00;
      --status-info-bg: #E6EEF7;
      --status-info-text: #2F5F8F;
      --status-danger-bg: #FBE7E2;
      --status-danger-text: #C8322F;
      --status-disabled-bg: #F6E6C8;
      --status-disabled-text: #8A6E5E;

      /* สีโซนครัว (จุดวงกลม 10px หน้าชื่อโซน + เส้นซ้ายการ์ด 4px) */
      --zone-steam: #5B9A8B;   /* นึ่ง */
      --zone-fry: #E08A3C;     /* ทอด */
      --zone-congee: #A9785A;  /* โจ๊ก-เส้น */
      --zone-drink: #C46A9B;   /* เครื่องดื่ม-ของหวาน */

      /* 3. ตัวอักษร */
      --font-heading: 'Mitr', sans-serif;
      --font-body: 'Sarabun', sans-serif;

      /* 4. ระยะห่าง ขอบมน เงา (ตัวเลขตายตัว) */
      --space-4: 4px;
      --space-8: 8px;
      --space-12: 12px;
      --space-16: 16px;
      --space-20: 20px;
      --space-24: 24px;
      --space-32: 32px;
      --space-48: 48px;

      --radius-control: 12px;  /* input / ปุ่ม / แท็บ / รูปเมนู */
      --radius-card: 16px;     /* การ์ด / ตาราง / แผง / ไทล์โต๊ะ */
      --radius-modal: 24px;    /* modal / bottom sheet */
      --radius-pill: 999px;    /* badge / chip / avatar */

      --border-default: 1.5px solid var(--cream-300);
      --shadow-sticker: 0 4px 0 #EBD3A8;
      --shadow-primary: 0 4px 0 var(--red-700);
      --shadow-modal: 0 12px 32px rgba(74, 44, 34, 0.18);
      --shadow-sticky-up: 0 -4px 0 #EBD3A8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--cream-100);
      color: var(--brown-900);
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 16px;
      line-height: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Typography classes per Section 3 */
    .ns-h1 {
      font-family: var(--font-heading);
      font-weight: 500;
      font-size: 32px;
      line-height: 40px;
    }
    @media (max-width: 767px) {
      .ns-h1 {
        font-size: 26px;
        line-height: 34px;
      }
    }
    .ns-h2 {
      font-family: var(--font-heading);
      font-weight: 500;
      font-size: 24px;
      line-height: 32px;
    }
    .ns-h3 {
      font-family: var(--font-heading);
      font-weight: 500;
      font-size: 20px;
      line-height: 28px;
    }
    .ns-body {
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 24px;
    }
    .ns-small {
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 20px;
    }
    .ns-caption {
      font-family: var(--font-body);
      font-size: 12px;
      line-height: 16px;
    }
    .ns-price {
      font-family: var(--font-body);
      font-weight: 600;
      color: var(--brown-900);
    }

    /* Standard Components per Section 5 */
    .ns-card {
      background-color: var(--cream-50);
      border: 1.5px solid var(--cream-300);
      border-radius: var(--radius-card);
      padding: var(--space-20);
      box-shadow: var(--shadow-sticker);
    }

    .ns-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-8);
      height: 44px;
      padding: 0 var(--space-20);
      border-radius: var(--radius-control);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 16px;
      line-height: 24px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease;
      user-select: none;
      white-space: nowrap;
    }
    .ns-btn-sm {
      height: 36px;
      padding: 0 var(--space-16);
      font-size: 14px;
      line-height: 20px;
    }
    .ns-btn-lg {
      height: 56px;
      padding: 0 var(--space-24);
    }
    .ns-btn-primary {
      background-color: var(--red-600);
      color: var(--white);
      border: none;
      box-shadow: 0 4px 0 var(--red-700);
    }
    .ns-btn-primary:hover {
      background-color: var(--red-700);
    }
    .ns-btn-primary:active {
      transform: translateY(2px);
    }
    .ns-btn-secondary {
      background-color: var(--cream-50);
      color: var(--brown-900);
      border: 1.5px solid var(--cream-300);
      box-shadow: var(--shadow-sticker);
    }
    .ns-btn-secondary:hover {
      background-color: var(--cream-200);
    }
    .ns-btn-secondary:active {
      transform: translateY(2px);
    }
    .ns-btn-danger {
      background-color: var(--white);
      color: var(--red-600);
      border: 1.5px solid var(--red-600);
      box-shadow: var(--shadow-sticker);
    }
    .ns-btn-danger:hover {
      background-color: var(--red-50);
    }
    .ns-btn-danger:active {
      transform: translateY(2px);
    }
    .ns-btn-ghost {
      background-color: transparent;
      color: var(--red-600);
      border: none;
      box-shadow: none;
    }
    .ns-btn-ghost:hover {
      background-color: var(--red-50);
    }
    .ns-btn-disabled,
    .ns-btn:disabled {
      background-color: var(--cream-200) !important;
      color: var(--brown-500) !important;
      border: 1.5px solid var(--cream-300) !important;
      box-shadow: none !important;
      cursor: not-allowed !important;
      transform: none !important;
    }

    .ns-input {
      width: 100%;
      height: 44px;
      border-radius: var(--radius-control);
      background-color: var(--white);
      border: 1.5px solid var(--cream-300);
      padding: 0 var(--space-16);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 24px;
      color: var(--brown-900);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .ns-input::placeholder {
      color: var(--brown-500);
    }
    .ns-input:focus {
      border-color: var(--red-600);
      box-shadow: 0 0 0 3px var(--red-50);
    }
    .ns-input:disabled {
      background-color: var(--cream-200);
      color: var(--brown-500);
      cursor: not-allowed;
    }

    .ns-label {
      display: block;
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      color: var(--brown-900);
      margin-bottom: var(--space-8);
    }

    .ns-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-4);
      height: 24px;
      padding: 0 10px;
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Switch toggle per reference image */
    .ns-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 44px;
      height: 24px;
      border-radius: var(--radius-pill);
      transition: background-color 0.2s ease;
      cursor: pointer;
      border: none;
      padding: 2px;
      flex-shrink: 0;
    }
    .ns-switch-on {
      background-color: var(--red-600);
    }
    .ns-switch-off {
      background-color: var(--cream-300);
    }
    .ns-switch-thumb {
      width: 20px;
      height: 20px;
      border-radius: var(--radius-pill);
      background-color: var(--white);
      transition: transform 0.2s ease;
    }
    .ns-switch-on .ns-switch-thumb {
      transform: translateX(20px);
    }
    .ns-switch-off .ns-switch-thumb {
      transform: translateX(0);
    }

    /* Custom scrollbar for sidebar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--cream-50);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--cream-300);
      border-radius: var(--radius-pill);
    }

    /* Drag and drop visual feedback */
    .cat-row-dragging {
      opacity: 0.55;
      background-color: var(--cream-200) !important;
      border: 1.5px dashed var(--bamboo) !important;
    }
    .cat-row-dragover {
      border-top: 2px solid var(--red-600) !important;
    }
  </style>
</head>
<body class="min-h-screen bg-cream-100 text-brown-900">

    function loadPersistedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.categories) && parsed.categories.length > 0) {
          state.categories = parsed.categories;
        }
        if (Array.isArray(parsed.menus) && parsed.menus.length > 0) {
          state.menus = parsed.menus;
        }
        if (Array.isArray(parsed.priceLogs)) {
          state.priceLogs = parsed.priceLogs;
        }
      } catch (err) {
        // Ignore storage errors in restricted iframe
      }
    }

    function savePersistedState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          categories: state.categories,
          menus: state.menus,
          priceLogs: state.priceLogs
        }));
      } catch (err) {
        // Ignore storage errors in restricted iframe
      }
    }

    function resetToDefaultData() {
      state.categories = JSON.parse(JSON.stringify(INITIAL_CATEGORIES));
      state.menus = JSON.parse(JSON.stringify(INITIAL_MENUS));
      state.selectedCategoryId = 'all';
      state.selectedZone = 'all';
      state.searchQuery = '';
      state.roleDropdownOpen = false;
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (err) {}
      showToast('รีเซ็ตหมวดหมู่และเมนูกลับเป็นค่าเริ่มต้น (4 หมวด 30 เมนู) แล้ว', 'info');
      renderAll();
    }

    function getCurrentRole() {
      return ROLES.find(r => r.id === state.currentRoleId) || ROLES[0];
    }

    function getCategoryById(catId) {
      return state.categories.find(c => c.id === catId);
    }

    function getCategoryEmoji(catId) {
      const cat = getCategoryById(catId);
      if (cat && cat.emoji) return cat.emoji;
      return '🥟';
    }

    function getMenuCountByCategory(catId) {
      return state.menus.filter(m => m.categoryId === catId).length;
    }

    /* =========================================================================
       Toast System (ข้อ 5: มุมขวาบน / มือถือกลางบน การ์ดขาวขอบซ้าย 4px สีสถานะ หายเองใน 3 วินาที)
       ========================================================================= */
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const borderColors = {
        success: 'var(--status-success-text)',
        danger: 'var(--status-danger-text)',
        warning: 'var(--status-warning-text)',
        info: 'var(--status-info-text)'
      };
      const badgeStyles = {
        success: 'background: var(--status-success-bg); color: var(--status-success-text);',
        danger: 'background: var(--status-danger-bg); color: var(--status-danger-text);',
        warning: 'background: var(--status-warning-bg); color: var(--status-warning-text);',
        info: 'background: var(--status-info-bg); color: var(--status-info-text);'
      };
      const badgeLabels = {
        success: 'สำเร็จ',
        danger: 'ผิดพลาด',
        warning: 'แจ้งเตือน',
        info: 'ข้อมูล'
      };

      const toastEl = document.createElement('div');
      toastEl.className = 'pointer-events-auto bg-white rounded-control p-4 flex items-start gap-3 transition-all duration-200';
      toastEl.style.border = '1.5px solid var(--cream-300)';
      toastEl.style.borderLeft = `4px solid ${borderColors[type] || borderColors.success}`;
      toastEl.style.boxShadow = 'var(--shadow-sticker)';

      toastEl.innerHTML = `
        <span class="ns-badge shrink-0" style="${badgeStyles[type] || badgeStyles.success}">${badgeLabels[type] || 'สำเร็จ'}</span>
        <div class="ns-small text-brown-900 font-semibold flex-1">${message}</div>
      `;

      container.appendChild(toastEl);

      setTimeout(() => {
        toastEl.style.opacity = '0';
        toastEl.style.transform = 'translateY(-8px)';
        setTimeout(() => {
          if (toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
        }, 200);
      }, 3000);
    }

                ${[

                    <div class="ns-small text-brown-900">• ส่วนลด ฿100 (<span style="color: var(--gold); font-weight: 600;">200 แต้ม</span>)</div>

    /* =========================================================================
       Shell B: หน้าสั่งอาหารจาก QR (มือถือเท่านั้น Navbar 56px + โต๊ะ T05 + Sticky bar 72px)
       ========================================================================= */
    function renderCustomerQrShell() {
      const visibleCategories = state.categories.filter(c => !c.hidden);
      const filteredMenus = state.menus.filter(m => {
        const cat = getCategoryById(m.categoryId);
        if (cat && cat.hidden) return false;
        if (state.selectedCategoryId !== 'all' && m.categoryId !== state.selectedCategoryId) return false;
        return true;
      });

      let totalQty = 0;
      let totalPrice = 0;
      Object.entries(state.cart).forEach(([mId, qty]) => {
        const item = state.menus.find(m => m.id === mId);
        if (item && qty > 0) {
          totalQty += qty;
          totalPrice += item.price * qty;
        }
      });

      return `
        <div class="min-h-screen bg-cream-100 flex flex-col items-center">
          <div class="w-full max-w-[430px] min-h-screen bg-cream-100 flex flex-col relative" style="border-left: 1.5px solid var(--cream-300); border-right: 1.5px solid var(--cream-300);">

            <header class="h-[56px] bg-cream-50 px-4 flex items-center justify-between sticky top-0 z-30" style="border-bottom: 1.5px solid var(--cream-300);">
              ${renderLogo()}
              <div class="flex items-center gap-2">
                <span class="ns-badge bg-red-50 text-red-600">โต๊ะ T05</span>
                <button type="button" onclick="setCustomerSubMode('home')" class="ns-btn ns-btn-sm ns-btn-secondary">หน้าหลัก</button>
              </div>
            </header>

            <main class="flex-1 p-4 pb-28">
              <div class="ns-caption text-brown-500 mb-3">บิล B20261024-012 · โต๊ะ T05 (4 คน) · เปิด 11:05</div>

              <!-- แถบเลือกหมวด -->
              <div class="flex overflow-x-auto gap-2 pb-2 mb-4">
                <button
                  type="button"
                  onclick="selectCategory('all')"
                  class="h-[36px] px-4 rounded-pill ns-small font-semibold shrink-0 ${
                    state.selectedCategoryId === 'all' ? 'bg-red-600 text-white' : 'bg-cream-50 text-brown-900'
                  }"
                  style="border: 1.5px solid var(--cream-300);"
                >ทั้งหมด</button>
                ${visibleCategories.map(cat => `
                  <button
                    type="button"
                    onclick="selectCategory('${cat.id}')"
                    class="h-[36px] px-4 rounded-pill ns-small font-semibold shrink-0 ${
                      state.selectedCategoryId === cat.id ? 'bg-red-600 text-white' : 'bg-cream-50 text-brown-900'
                    }"
                    style="border: 1.5px solid var(--cream-300);"
                  >${cat.emoji} ${escapeHtml(cat.name)}</button>
                `).join('')}
              </div>

              <!-- รายการการ์ดเมนู -->
              <div class="flex flex-col gap-4">
                ${filteredMenus.map(menu => {
                  const emoji = getCategoryEmoji(menu.categoryId);
                  const qty = state.cart[menu.id] || 0;
                  const isOut = !menu.available;
                  return `
                    <div class="ns-card">
                      <div class="relative w-full aspect-[4/3] rounded-control bg-cream-200 overflow-hidden mb-3 flex items-center justify-center">
                        ${menu.image ? `<img src="${menu.image}" alt="${escapeHtml(menu.name)}" class="w-full h-full object-cover ${isOut ? 'opacity-50' : ''}" />` : `<span class="text-[40px] ${isOut ? 'opacity-50' : ''}">${emoji}</span>`}
                        ${isOut ? `<span class="ns-badge absolute top-2 right-2" style="background: var(--status-danger-bg); color: var(--status-danger-text);">หมด</span>` : ''}
                      </div>
                      <h3 class="ns-body font-semibold text-brown-900 m-0 mb-1 ${isOut ? 'opacity-50' : ''}">${escapeHtml(menu.name)}</h3>
                      <p class="ns-small text-brown-500 m-0 mb-3 truncate ${isOut ? 'opacity-50' : ''}">${escapeHtml(menu.description)}</p>
                      <div class="flex items-center justify-between pt-2" style="border-top: 1.5px solid var(--cream-300);">
                        <div class="${isOut ? 'opacity-50' : ''}">
                          <span class="ns-price ns-body">฿${menu.price}</span>
                          <span class="ns-small text-brown-500"> /${escapeHtml(menu.unit)}</span>
                        </div>
                        <div class="flex items-center gap-2">
                          <button
                            type="button"
                            ${isOut || qty === 0 ? 'disabled' : ''}
                            onclick="updateCartQty('${menu.id}', -1)"
                            class="w-9 h-9 rounded-control flex items-center justify-center ${isOut || qty === 0 ? 'bg-cream-200 text-brown-500' : 'bg-cream-50 text-brown-900'}"
                            style="border: 1.5px solid var(--cream-300);"
                          >${icon('minus')}</button>
                          <span class="ns-body font-semibold w-6 text-center">${qty}</span>
                          <button
                            type="button"
                            ${isOut ? 'disabled' : ''}
                            onclick="updateCartQty('${menu.id}', 1)"
                            class="w-9 h-9 rounded-control flex items-center justify-center ${isOut ? 'bg-cream-200 text-brown-500' : 'bg-red-600 text-white'}"
                          >${icon('plus')}</button>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </main>

            <!-- ปุ่มหลักติดล่างจอ (sticky bar สูง 72px พื้นขาว เงาขึ้นบน) -->

              <div>
                <div class="ns-caption text-brown-500">ตะกร้าโต๊ะ T05 (${totalQty} รายการ)</div>
                <div class="ns-price ns-h3">฿${totalPrice}</div>
              </div>
              <button
                type="button"
                ${totalQty === 0 ? 'disabled' : ''}
                onclick="submitQrOrder()"
                class="ns-btn ns-btn-primary"
              >
                ${icon('shopping-bag')}
                <span>ส่งออเดอร์เข้าครัว</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

                          <span class="text-[40px] leading-none">${emoji}</span>

                    </div>

                      <label class="ns-btn ns-btn-secondary ns-btn-sm cursor-pointer w-full">

                        <span>ใช้ภาพวาดการ์ตูนตัวอย่าง</span>
                      </button>
                      ${d.image ? `
                        <button

                  </div>

                <!-- หมวด และ ชื่อเมนู -->

                      ${state.categories.map(c => `

                          d.emoji === em ? 'bg-red-50' : 'bg-white hover:bg-cream-200'
                        }"
                        style="border: ${d.emoji === em ? '2px solid var(--red-600)' : '1.5px solid var(--cream-300)'};"
                      >${em}</button>
                    `).join('')}
                  </div>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4" style="border-top: 1.5px solid var(--cream-300);">
                  <button type="button" onclick="closeModal()" class="ns-btn ns-btn-secondary">
                    ยกเลิก
                  </button>
                  <button type="submit" class="ns-btn ns-btn-primary">
                    ยืนยัน
                  </button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      return '';
    }

    /* =========================================================================
       Role Simulator Floating Button (ข้อ 6D: ปุ่มจำลองบทบาท มุมขวาล่าง "โหมดจำลอง ▾")
       ========================================================================= */
    function renderRoleSimulator() {
      const currentRole = getCurrentRole();
      return `
        <div class="relative">
          ${state.roleDropdownOpen ? `
            <div
              class="absolute bottom-14 right-0 w-64 bg-cream-50 rounded-card p-2 mb-1"
              style="border: 1.5px solid var(--cream-300); box-shadow: var(--shadow-modal);"
            >
              <div class="px-3 py-1.5 ns-caption text-brown-500 font-semibold" style="border-bottom: 1px solid var(--cream-300);">
                สลับบทบาทจำลอง (6 โหมด)
              </div>
              <div class="flex flex-col gap-1 mt-1">
                ${ROLES.map(r => {
                  const active = r.id === currentRole.id;
                  return `
                    <button
                      type="button"
                      onclick="switchRole('${r.id}')"
                      class="w-full px-3 py-2 rounded-control text-left flex items-center justify-between ns-small transition-colors ${
                        active ? 'bg-red-50 text-red-600 font-semibold' : 'text-brown-900 hover:bg-cream-200'
                      }"
                    >
                      <div>
                        <div>${r.label}</div>
                        ${r.staffName ? `<div class="ns-caption text-brown-500">${r.staffName}</div>` : ''}
                      </div>
                      ${active ? icon('check') : ''}
                    </button>
                  `;
                }).join('')}
              </div>
              <div class="mt-2 pt-2" style="border-top: 1px solid var(--cream-300);">
                <button
                  type="button"
                  onclick="resetToDefaultData()"
                  class="w-full px-3 py-2 rounded-control text-left ns-caption text-red-600 font-semibold hover:bg-red-50 transition-colors"
                >
                  ↺ รีเซ็ตข้อมูลเมนูเริ่มต้น (30 เมนู)
                </button>
              </div>
            </div>
          ` : ''}

          <button
            type="button"
            onclick="toggleRoleDropdown()"
            class="h-[44px] px-5 rounded-pill bg-brown-900 text-white ns-small font-semibold flex items-center gap-2 cursor-pointer transition-transform active:translate-y-[1px]"
            style="box-shadow: var(--shadow-modal);"
            title="ปัจจุบัน: ${currentRole.label}"
          >
            <span>โหมดจำลอง</span>
            ${icon(state.roleDropdownOpen ? 'chevron-up' : 'chevron-down')}
          </button>
        </div>
      `;
    }

    /* =========================================================================
       Interactive Event Handlers
       ========================================================================= */
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function toggleRoleDropdown() {
      state.roleDropdownOpen = !state.roleDropdownOpen;
      renderAll();
    }

    function switchRole(roleId) {
      const target = ROLES.find(r => r.id === roleId);
      if (!target) return;
      state.currentRoleId = roleId;
      state.roleDropdownOpen = false;
      state.mobileSidebarOpen = false;
      state.customerMemberDropdownOpen = false;

      if (target.shell === 'staff') {
        // Keep user on เมนูและหมวด for Owner, Manager, Chef so they can test role permissions directly
        if (roleId === 'owner' || roleId === 'manager' || roleId === 'chef') {
          state.activeStaffPage = 'เมนูและหมวด';
        } else {
          state.activeStaffPage = target.defaultPage || 'ผังโต๊ะ';
        }
      } else {
        state.customerSubMode = 'home';
      }

      showToast(`สลับเป็นโหมด "${target.label}" ${target.staffName ? `(${target.staffName})` : ''}`, 'info');
      renderAll();
    }

    function toggleStoreStatus() {
      state.storeOpen = !state.storeOpen;
      showToast(
        state.storeOpen
          ? 'เปลี่ยนสถานะร้านเป็น "เปิดอยู่ · กะเช้า · ปิดรับออเดอร์ 13:30"'
          : 'เปลี่ยนสถานะร้านเป็น "ปิดอยู่"',
        state.storeOpen ? 'success' : 'warning'
      );
      renderAll();
    }

    function handleStaffLogout() {
      state.currentRoleId = 'customer_guest';
      state.customerSubMode = 'home';
      showToast('ออกจากระบบพนักงานเรียบร้อยแล้ว', 'info');
      renderAll();
    }

    function toggleMobileSidebar(open) {
      state.mobileSidebarOpen = Boolean(open);
      renderAll();
    }

    function navigateStaffPage(pageName) {
      state.activeStaffPage = pageName;
      state.mobileSidebarOpen = false;
      renderAll();
    }

    function selectCategory(catId) {
      state.selectedCategoryId = catId;
      renderAll();
    }

    function selectZone(zoneId) {
      state.selectedZone = zoneId;
      renderAll();
    }

    function handleSearchInput(val) {
      state.searchQuery = val;
      renderAll();
      const input = document.getElementById('menu-search-input');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function resetMenuFilters() {
      state.selectedCategoryId = 'all';
      state.selectedZone = 'all';
      state.searchQuery = '';
      showToast('ล้างตัวกรองการค้นหาทั้งหมดแล้ว', 'info');
      renderAll();
    }

    function toggleMenuAvailable(menuId) {
      const item = state.menus.find(m => m.id === menuId);
      if (!item) return;
      item.available = !item.available;
      showToast(
        item.available
          ? `เปิดขายเมนู "${item.name}" แล้ว`
          : `ปิดขายเมนู "${item.name}" (ขึ้นสถานะ "หมด")`,
        item.available ? 'success' : 'warning'
      );
      renderAll();
    }

    /* Category Hide / Edit / Add & Drag-and-Drop */
    function toggleHideCategory(catId) {
      const cat = getCategoryById(catId);
      if (!cat) return;
      const count = getMenuCountByCategory(catId);
      if (!cat.hidden && count > 0) {
        // ข้อกำหนด: ซ่อนหมวดที่ยังมีเมนูไม่ได้ → toast แดงอธิบาย
        showToast(`ซ่อนหมวด "${cat.name}" ไม่ได้ เนื่องจากยังมีเมนูในหมวดนี้อยู่ ${count} รายการ`, 'danger');
        return;
      }
      cat.hidden = !cat.hidden;
      showToast(
        cat.hidden ? `ซ่อนหมวด "${cat.name}" เรียบร้อยแล้ว` : `แสดงหมวด "${cat.name}" เรียบร้อยแล้ว`,
        cat.hidden ? 'warning' : 'success'
      );
      renderAll();
    }

    function handleCatDragStart(e, index) {
      state.draggedCategoryIndex = index;
      if (e.currentTarget) e.currentTarget.classList.add('cat-row-dragging');
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(index));
      }
    }

    function handleCatDragOver(e, index) {
      e.preventDefault();
      if (e.currentTarget && state.draggedCategoryIndex !== index) {
        e.currentTarget.classList.add('cat-row-dragover');
      }
    }

    function handleCatDragLeave(e) {
      if (e.currentTarget) e.currentTarget.classList.remove('cat-row-dragover');
    }

    function handleCatDrop(e, dropIndex) {
      e.preventDefault();
      const fromIndex = state.draggedCategoryIndex;
      state.draggedCategoryIndex = null;
      if (fromIndex === null || fromIndex === dropIndex) {
        renderAll();
        return;
      }
      const moved = state.categories.splice(fromIndex, 1)[0];
      state.categories.splice(dropIndex, 0, moved);
      showToast(`จัดเรียงหมวด "${moved.name}" ไปลำดับที่ ${dropIndex + 1} แล้ว`, 'success');
      renderAll();
    }

    function handleCatDragEnd(e) {
      state.draggedCategoryIndex = null;
      renderAll();
    }

    function openCategoryModal(catId = null) {
      if (catId) {
        const cat = getCategoryById(catId);
        if (!cat) return;
        state.modal = {
          type: 'category_form',
          data: { id: cat.id, name: cat.name, emoji: cat.emoji }
        };
      } else {
        state.modal = {
          type: 'category_form',
          data: { id: null, name: '', emoji: '🥟' }
        };
      }
      renderAll();
    }

    function selectCategoryFormEmoji(emoji) {
      if (state.modal && state.modal.type === 'category_form') {
        state.modal.data.emoji = emoji;
        renderModalOnly();
      }
    }

    function submitCategoryForm(e) {
      e.preventDefault();
      if (!state.modal || state.modal.type !== 'category_form') return;
      const d = state.modal.data;
      const cleanName = (d.name || '').trim();
      if (!cleanName) {
        showToast('กรุณากรอกชื่อหมวดหมู่', 'danger');
        return;
      }
      if (d.id) {
        const cat = getCategoryById(d.id);
        if (cat) {
          cat.name = cleanName;
          cat.emoji = d.emoji || '🥟';
          showToast(`แก้ไขหมวดหมู่ "${cleanName}" เรียบร้อยแล้ว`, 'success');
        }
      } else {
        const newId = 'cat_' + Date.now();
        state.categories.push({
          id: newId,
          name: cleanName,
          emoji: d.emoji || '🥟',
          hidden: false
        });
        showToast(`เพิ่มหมวดหมู่ "${cleanName}" เรียบร้อยแล้ว (0 เมนู — สามารถทดสอบกดซ่อนหมวดได้)`, 'success');
      }
      state.modal = null;
      renderAll();
    }

    /* Menu Add / Edit / Delete Modals */
    function openMenuModal(menuId = null) {
      if (menuId) {
        const item = state.menus.find(m => m.id === menuId);
        if (!item) return;
        state.modal = {
          type: 'menu_form',
          data: {
            id: item.id,
            categoryId: item.categoryId,
            name: item.name,
            description: item.description,
            price: item.price,
            originalPrice: item.price,
            unit: item.unit,
            zone: item.zone,
            batchSize: item.batchSize,
            image: item.image || ''
          }
        };
      } else {
        const defaultCat = state.selectedCategoryId !== 'all' ? state.selectedCategoryId : state.categories[0].id;
        state.modal = {
          type: 'menu_form',
          data: {
            id: null,
            categoryId: defaultCat,
            name: '',
            description: '',
            price: 45,
            originalPrice: 45,
            unit: 'เข่ง',
            zone: 'steam',
            batchSize: 10,
            image: ''
          }
        };
      }
      renderAll();
    }

    function updateMenuFormField(field, value, shouldRender = true) {
      if (!state.modal || state.modal.type !== 'menu_form') return;
      state.modal.data[field] = value;
      if (shouldRender) renderModalOnly();
    }

    function handlePriceInputChange(val) {
      if (!state.modal || state.modal.type !== 'menu_form') return;
      state.modal.data.price = val;
      const notice = document.getElementById('price-log-notice');
      if (notice) {
        notice.classList.remove('hidden');
      }
    }

    function handleMenuImageUpload(e) {
      const file = e.target.files && e.target.files[0];
      if (!file || !state.modal || state.modal.type !== 'menu_form') return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        state.modal.data.image = evt.target.result;
        renderModalOnly();
        showToast('อัปโหลดรูปพรีวิว 4:3 เรียบร้อยแล้ว', 'success');
      };
      reader.readAsDataURL(file);
    }

    function generateMenuIllustrationPreview() {
      if (!state.modal || state.modal.type !== 'menu_form') return;
      const emoji = getCategoryEmoji(state.modal.data.categoryId);
      const title = state.modal.data.name || 'ติ่มซำนิ่งสุข';
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
        <rect width="400" height="300" fill="#F6E6C8"/>
        <circle cx="200" cy="135" r="78" fill="#FFFBF3" stroke="#D9A961" stroke-width="4"/>
        <circle cx="200" cy="135" r="66" fill="none" stroke="#EBD3A8" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="200" y="152" font-size="56" text-anchor="middle">${emoji}</text>
        <text x="200" y="248" font-family="Sarabun, sans-serif" font-weight="600" font-size="20" fill="#4A2C22" text-anchor="middle">${escapeHtml(title)}</text>
      </svg>`;
      state.modal.data.image = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
      renderModalOnly();
      showToast('สร้างภาพพรีวิวสติกเกอร์ติ่มซำ 4:3 แล้ว', 'info');
    }

    function clearMenuImagePreview() {
      if (!state.modal || state.modal.type !== 'menu_form') return;
      state.modal.data.image = '';
      renderModalOnly();
    }

    function submitMenuForm(e) {
      e.preventDefault();
      if (!state.modal || state.modal.type !== 'menu_form') return;
      const d = state.modal.data;
      const cleanName = (d.name || '').trim();
      const numPrice = Number(d.price);
      const numBatch = Number(d.batchSize) || 10;

      if (!cleanName || isNaN(numPrice) || numPrice <= 0) {
        showToast('กรุณากรอกชื่อเมนูและราคาที่ถูกต้อง', 'danger');
        return;
      }

      if (d.id) {
        const existing = state.menus.find(m => m.id === d.id);
        if (existing) {
          const priceChanged = existing.price !== numPrice;
          const oldPrice = existing.price;
          existing.categoryId = d.categoryId;
          existing.name = cleanName;
          existing.description = (d.description || '').trim();
          existing.price = numPrice;
          existing.unit = d.unit;
          existing.zone = d.zone;
          existing.batchSize = numBatch;
          existing.image = d.image || '';

          if (priceChanged) {
            state.priceLogs.unshift({
              time: new Date().toTimeString().slice(0, 5),
              actor: getCurrentRole().staffName || 'สมชาย ใจดี',
              menuName: cleanName,
              oldPrice,
              newPrice: numPrice
            });
            showToast(`บันทึกเมนู "${cleanName}" และบันทึก Log แก้ราคา (฿${oldPrice} → ฿${numPrice}) แล้ว`, 'success');
          } else {
            showToast(`บันทึกการแก้ไขเมนู "${cleanName}" เรียบร้อยแล้ว`, 'success');
          }
        }
      } else {
        const newId = 'm_' + Date.now();
        state.menus.push({
          id: newId,
          categoryId: d.categoryId,
          name: cleanName,
          description: (d.description || '').trim() || 'เมนูติ่มซำทำสดใหม่ทุกวัน',
          price: numPrice,
          unit: d.unit,
          zone: d.zone,
          batchSize: numBatch,
          available: true,
          image: d.image || ''
        });
        showToast(`เพิ่มเมนูใหม่ "${cleanName}" (฿${numPrice}/${d.unit}) เรียบร้อยแล้ว`, 'success');
      }

      state.modal = null;
      renderAll();
    }

    function openDeleteMenuModal(menuId) {
      state.modal = { type: 'delete_menu', menuId };
      renderAll();
    }

    function confirmDeleteMenu(menuId) {
      const idx = state.menus.findIndex(m => m.id === menuId);
      if (idx !== -1) {
        const removed = state.menus.splice(idx, 1)[0];
        showToast(`ลบเมนู "${removed.name}" เรียบร้อยแล้ว`, 'success');
      }
      state.modal = null;
      renderAll();
    }

    function closeModal() {
      state.modal = null;
      renderAll();
    }

    /* Customer Shell Handlers */
    function setCustomerSection(sec) {
      state.customerActiveSection = sec;
      state.customerMobileNavOpen = false;
      state.customerMemberDropdownOpen = false;
      renderAll();
    }

    function setCustomerSubMode(mode) {
      state.customerSubMode = mode;
      state.customerMobileNavOpen = false;
      showToast(
        mode === 'qr' ? 'เปิดหน้าสั่งอาหารจาก QR (โต๊ะ T05)' : 'กลับสู่หน้าหลักฝั่งลูกค้า',
        'info'
      );
      renderAll();
    }

    function toggleCustomerMobileNav() {
      state.customerMobileNavOpen = !state.customerMobileNavOpen;
      renderAll();
    }

    function toggleCustomerMemberDropdown() {
      state.customerMemberDropdownOpen = !state.customerMemberDropdownOpen;
      renderAll();
    }

    function updateCartQty(menuId, delta) {
      const item = state.menus.find(m => m.id === menuId);
      if (!item || !item.available) return;
      const current = state.cart[menuId] || 0;
      const next = current + delta;
      if (next > 10) {
        showToast('สั่งได้ไม่เกิน 10 ต่อเมนูต่อครั้ง', 'warning');
        return;
      }
      if (next <= 0) {
        delete state.cart[menuId];
      } else {
        state.cart[menuId] = next;
      }
      renderAll();
    }

    function submitQrOrder() {
      state.cart = {};
      showToast('ส่งออเดอร์โต๊ะ T05 เข้าครัวเรียบร้อยแล้ว (สถานะ: รอทำ)', 'success');
      renderAll();
    }

    /* =========================================================================
       Render Functions
       ========================================================================= */
    function renderModalOnly() {
      const modalRoot = document.getElementById('modal-root');
      if (modalRoot) modalRoot.innerHTML = renderModal();
    }

    function renderAll() {
      savePersistedState();
      const appRoot = document.getElementById('app-root');
      const modalRoot = document.getElementById('modal-root');
      const roleRoot = document.getElementById('role-simulator-root');

      const role = getCurrentRole();
      if (appRoot) {
        appRoot.innerHTML = role.shell === 'staff' ? renderStaffShell() : renderCustomerShell();
      }
      if (modalRoot) {
        modalRoot.innerHTML = renderModal();
      }
      if (roleRoot) {
        roleRoot.innerHTML = renderRoleSimulator();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadPersistedState();
      renderAll();
    });
  </script>
</body>
</html>
