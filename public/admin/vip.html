<!doctype html>
<!-- จองห้อง VIP (คนที่ 4 · เฟส 3) — staff ที่มีช่องติ๊ก [จอง VIP] / ผู้จัดการ / เจ้าของร้าน -->
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>จองห้อง VIP · นึ่งสุข</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="app"></div>

  <template id="page">
    <div class="toolbar">
      <div class="row">
        <button class="btn btn-secondary btn-sm" id="prevDay"><i data-icon="chevron-left"></i></button>
        <input class="input" id="dayInput" type="date" style="width:180px">
        <button class="btn btn-secondary btn-sm" id="nextDay"><i data-icon="chevron-right"></i></button>
        <button class="btn btn-ghost btn-sm" id="todayBtn">วันนี้</button>
      </div>
      <button class="btn" id="newBtn">+ จองห้อง VIP</button>
    </div>

    <div class="split">
      <div class="stack">
        <div class="card">
          <div class="row-between">
            <h3 class="card-title"><i data-icon="crown"></i> ตารางห้อง × ชั่วโมง</h3>
            <div class="row small" id="legend"></div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead id="gridHead"></thead>
              <tbody id="gridBody"><tr><td class="loading">กำลังโหลด...</td></tr></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <h3 class="card-title"><i data-icon="clipboard"></i> การจองของวัน</h3>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>เวลา</th><th>ห้อง</th><th>ลูกค้า</th><th class="num">คน</th><th class="num">pre-order</th><th class="num">มัดจำ</th><th>สถานะ</th></tr></thead>
              <tbody id="listBody"><tr><td colspan="7" class="loading">กำลังโหลด...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <aside class="side-panel" id="panel">
        <div class="empty"><div class="empty-icon"><i data-icon="crown"></i></div>เลือกการจองจากตาราง หรือกดช่องว่างเพื่อจองใหม่</div>
      </aside>
    </div>
  </template>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/layout.js"></script>
  <!-- bill-panel.js (คนที่ 5) ใช้ showBillQr แสดง QR หลังลูกค้ามาถึง · ไม่มีไฟล์ก็ใช้หน้านี้ได้ -->
  <script src="/assets/js/bill-panel.js"></script>
  <script src="/assets/js/vip.js"></script>
</body>
</html>
