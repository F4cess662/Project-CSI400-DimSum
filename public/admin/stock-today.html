<!doctype html>
<!-- หน้าจำนวนพร้อมขาย (คนที่ 3 · เฟส 2 + Feedback เฟส 3)
     ใช้ Sidebar และ Topbar กลางจาก /assets/js/layout.js (initStaffPage) -->
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>จำนวนพร้อมขาย · นึ่งสุข</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="app"></div>

  <template id="page">
    <!-- การ์ดสรุป 3 ใบ -->
    <div class="grid grid-3 section">
      <div class="card stat">
        <div class="stat-icon" style="background:var(--ok-bg); color:var(--ok)"><i data-icon="dumpling"></i></div>
        <div>
          <div class="stat-value" id="statOkCount">0</div>
          <div class="stat-label">พร้อมขายปกติ (รายการ)</div>
        </div>
      </div>
      <div class="card stat">
        <div class="stat-icon" style="background:var(--wait-bg); color:var(--wait)"><i data-icon="alert"></i></div>
        <div>
          <div class="stat-value" id="statLowCount">0</div>
          <div class="stat-label">ใกล้หมด ≤ 1 ล็อต / หมดชั่วคราว (รายการ)</div>
        </div>
      </div>
      <div class="card stat">
        <div class="stat-icon" style="background:var(--bad-bg); color:var(--bad)"><i data-icon="ban"></i></div>
        <div>
          <div class="stat-value" id="statOutCount">0</div>
          <div class="stat-label">หมด · ปิดขาย (รายการ)</div>
        </div>
      </div>
    </div>

    <!-- แท็บโซนครัว + ช่องค้นหา/กรองหมวด + ปุ่มล้างจำนวนพร้อมขายทั้งหมด (Feedback #4, #5) -->
    <div class="card section">
      <div class="toolbar">
        <div class="tabs" id="zoneTabs">
          <button type="button" class="tab active" data-zone="all">ทุกโซน</button>
          <button type="button" class="tab zone-steam" data-zone="steam"><span class="zone-dot"></span>นึ่ง</button>
          <button type="button" class="tab zone-fry" data-zone="fry"><span class="zone-dot"></span>ทอด</button>
          <button type="button" class="tab zone-congee_noodle" data-zone="congee_noodle"><span class="zone-dot"></span>จานหลัก</button>
          <button type="button" class="tab zone-drink_dessert" data-zone="drink_dessert"><span class="zone-dot"></span>เครื่องดื่ม-ของหวาน</button>
        </div>

        <div class="row">
          <select class="select" id="catSelect" style="width:180px">
            <option value="all">ทุกหมวดอาหาร</option>
          </select>
          <input type="search" class="input" id="searchInput" style="width:220px" placeholder="ค้นหาชื่อเมนู / ไส้...">
          <button type="button" class="btn btn-danger btn-sm" id="resetStockBtn">
            <i data-icon="refresh"></i> ล้างจำนวนพร้อมขายทั้งหมด
          </button>
        </div>
      </div>

      <!-- ตารางจัดการจำนวนพร้อมขาย + ปุ่ม +1 ล็อต (ตามหน่วย) + กรอกเอง + ปุ่มล้าง -->
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>เมนูอาหาร</th>
              <th>หมวด / โซนครัว</th>
              <th class="num">ราคา / หน่วย</th>
              <th class="num">ขนาดล็อต</th>
              <th class="num">คงเหลือพร้อมหน่วย</th>
              <th>สถานะ</th>
              <th>เติมล็อต / กรอกจำนวน / ล้าง</th>
              <th>เปิดขาย</th>
            </tr>
          </thead>
          <tbody id="stockRows">
            <tr><td colspan="8" class="loading">กำลังโหลดข้อมูล...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </template>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/stock-today.js"></script>
</body>
</html>
