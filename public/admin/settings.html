<!doctype html>
<!-- ตั้งค่าร้าน (คนที่ 4 · เฟส 1) — เจ้าของร้านเท่านั้น -->
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตั้งค่าร้าน · นึ่งสุข</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="app"></div>

  <template id="page">
    <form id="form" class="stack" style="max-width:860px" autocomplete="off">
      <div class="card">
        <h3 class="card-title"><i data-icon="store"></i> ข้อมูลร้าน</h3>
        <div class="field"><label for="shop_name">ชื่อร้าน</label><input class="input" id="shop_name" readonly tabindex="-1" style="background:var(--surface-2,#f3ede2);color:var(--muted,#8a7a6a);cursor:not-allowed" title="ชื่อร้านแก้ไม่ได้"><div class="caption muted">ชื่อร้านเป็นชื่อแบรนด์ แก้ไขในระบบไม่ได้</div></div>
        <div class="grid grid-2">
          <div class="field"><label for="phone">เบอร์โทร</label><input class="input" id="phone" maxlength="20"></div>
          <div class="field"><label for="email">อีเมล</label><input class="input" id="email" type="email" maxlength="100"></div>
        </div>
        <div class="field"><label for="address">ที่อยู่</label><textarea class="textarea" id="address" rows="2" maxlength="255"></textarea></div>
      </div>

      <div class="card">
        <h3 class="card-title"><i data-icon="clock"></i> เวลาเปิด-ปิด 2 กะ</h3>
        <div class="bold" style="margin-bottom:8px">รอบเช้า</div>
        <div class="grid grid-3">
          <div class="field"><label for="morning_open">เวลาเปิด</label><input class="input" id="morning_open" type="time" required></div>
          <div class="field"><label for="morning_last_order">ปิดรับออเดอร์</label><input class="input" id="morning_last_order" type="time" required></div>
          <div class="field"><label for="morning_close">เวลาปิด</label><input class="input" id="morning_close" type="time" required></div>
        </div>
        <div class="bold" style="margin-bottom:8px">รอบเย็น</div>
        <div class="grid grid-3">
          <div class="field"><label for="evening_open">เวลาเปิด</label><input class="input" id="evening_open" type="time" required></div>
          <div class="field"><label for="evening_last_order">ปิดรับออเดอร์</label><input class="input" id="evening_last_order" type="time" required></div>
          <div class="field"><label for="evening_close">เวลาปิด</label><input class="input" id="evening_close" type="time" required></div>
        </div>
      </div>

      <div class="card">
        <h3 class="card-title"><i data-icon="receipt"></i> การสั่งอาหาร</h3>
        <div class="field" style="max-width:320px"><label for="max_qty_per_item">จำนวนสูงสุดต่อรายการ (ต่อครั้งที่สั่ง)</label>
          <input class="input" id="max_qty_per_item" type="number" min="1" max="99" required></div>
      </div>

      <div class="card">
        <h3 class="card-title"><i data-icon="crown"></i> ห้อง VIP</h3>
        <!-- Feedback เฟส 3: ขายค่าห้องเป็นแพ็กเกจ · ไม่มียอดสั่งขั้นต่ำ · ชั่วโมงตามแพ็กเกจ (ซ่อนช่อง vip_min_spend / vip_max_hours) -->
        <div class="field" style="max-width:320px"><label for="vip_deposit_percent">มัดจำ (% ของค่าห้อง + ค่าอาหารสั่งล่วงหน้า)</label>
          <input class="input" id="vip_deposit_percent" type="number" min="0" max="100" required></div>
        <div class="bold" style="margin:8px 0">ราคาแพ็กเกจ</div>
        <p class="caption muted">ใช้ห้องได้ถึงนาทีที่ :50 ของชั่วโมงสุดท้าย (รวมเวลาจัดห้อง 10 นาที) · เหมาวัน = กะเช้า + กะเย็น · แก้แล้วกด "บันทึก" ของแถวนั้น</p>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>รหัส</th><th>ชื่อแพ็กเกจ</th><th>ระยะเวลา</th><th class="num">ราคา (บาท)</th><th>เปิดใช้</th><th></th></tr></thead>
            <tbody id="pkgBody"><tr><td colspan="6" class="loading">กำลังโหลด...</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="row">
        <button class="btn btn-lg" type="submit" id="saveBtn">บันทึกการตั้งค่า</button>
        <button class="btn btn-secondary btn-lg" type="button" id="resetBtn">คืนค่าที่บันทึกไว้</button>
      </div>
    </form>
  </template>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    (async () => {
      const me = await initStaffPage({ title: 'ตั้งค่าร้าน', roles: ['owner'] });
      if (!me) return;

      const TEXT = ['phone', 'email', 'address']; // ส่งตอนบันทึก (ชื่อร้านดูได้อย่างเดียว)
      const TIME = ['morning_open', 'morning_last_order', 'morning_close', 'evening_open', 'evening_last_order', 'evening_close'];
      const NUM = ['max_qty_per_item', 'vip_deposit_percent'];
      const $ = (id) => document.getElementById(id);

      function fill(s) {
        $('shop_name').value = s.shop_name || '';
        TEXT.forEach((k) => { $(k).value = s[k] || ''; });
        TIME.forEach((k) => { $(k).value = (s[k] || '').slice(0, 5); });
        NUM.forEach((k) => { $(k).value = s[k] ?? ''; });
      }

      async function load() {
        const s = await run(() => api.get('settings'));
        if (s) fill(s);
      }

      /* ---------- แพ็กเกจห้อง VIP (GET ?all=1 / POST update) ---------- */
      async function loadPackages() {
        let rows;
        try { rows = await api.get('vip_packages', { all: 1 }); } catch (e) {
          $('pkgBody').innerHTML = `<tr><td colspan="6"><div class="alert alert-bad small">โหลดแพ็กเกจไม่สำเร็จ: ${fmt.esc(e.message)}</div></td></tr>`;
          return;
        }
        $('pkgBody').innerHTML = rows.length ? rows.map((p) => `<tr data-pkg="${p.id}">
            <td class="bold">${fmt.esc(p.code)}</td>
            <td><input class="input" data-name maxlength="100" value="${fmt.esc(p.name)}"></td>
            <td>${p.hours === null ? 'เหมาวัน (2 กะ)' : p.hours + ' ชม.'}</td>
            <td class="num"><input class="input" data-price type="number" min="0" step="1" value="${p.price}" style="max-width:140px"></td>
            <td><label class="switch"><input type="checkbox" data-active ${p.is_active ? 'checked' : ''}><span></span></label></td>
            <td><button type="button" class="btn btn-sm" data-save>บันทึก</button></td>
          </tr>`).join('') : '<tr><td colspan="6"><div class="empty">ยังไม่มีแพ็กเกจ</div></td></tr>';
        $('pkgBody').querySelectorAll('[data-pkg]').forEach((tr) => {
          tr.querySelector('[data-save]').onclick = async () => {
            const price = tr.querySelector('[data-price]').value;
            const body = {
              action: 'update', id: Number(tr.dataset.pkg), name: tr.querySelector('[data-name]').value.trim(),
              price: price === '' ? '' : Number(price), is_active: tr.querySelector('[data-active]').checked ? 1 : 0,
            };
            if (await run(() => api.post('vip_packages', body))) loadPackages();
          };
        });
      }

      $('resetBtn').onclick = () => { load(); loadPackages(); };
      $('form').onsubmit = async (e) => {
        e.preventDefault();
        const body = { action: 'update' };
        TEXT.forEach((k) => { body[k] = $(k).value.trim(); });
        TIME.forEach((k) => { body[k] = $(k).value; });
        NUM.forEach((k) => { body[k] = $(k).value === '' ? '' : Number($(k).value); });
        $('saveBtn').disabled = true;
        const saved = await run(() => api.post('settings', body));
        $('saveBtn').disabled = false;
        if (saved) { fill(saved); window.SHOP = saved; }
      };
      load();
      loadPackages();
    })();
  </script>
</body>
</html>
