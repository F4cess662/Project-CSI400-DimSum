<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>จัดการวัตถุดิบ · นึ่งสุข</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="app"></div>

  <template id="page">
    <section class="section">
      <div class="toolbar">
        <div>
          <h2>จัดการวัตถุดิบ</h2>
          <p class="muted small">ตรวจสอบจำนวนคงเหลือและจุดสั่งซื้อซ้ำ</p>
        </div>
        <button class="btn" id="addBtn">+ เพิ่มวัตถุดิบ</button>
      </div>

      <div class="card">
        <div class="toolbar">
          <input class="input" id="search"
            placeholder="ค้นหาชื่อวัตถุดิบ..." style="max-width:320px">
          <label class="check">
            <input type="checkbox" id="lowOnly">
            แสดงเฉพาะรายการที่ต้องสั่ง
          </label>
          <button class="btn btn-secondary btn-sm" id="refreshBtn">รีเฟรช</button>
        </div>
        <div class="row">
          <span class="badge badge-ok" id="normalCount">ปกติ 0 รายการ</span>
          <span class="badge badge-wait" id="lowCount">ต้องสั่ง 0 รายการ</span>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>วัตถุดิบ</th>
              <th>คงเหลือ</th>
              <th>จุดสั่งซื้อซ้ำ</th>
              <th>ระดับคงเหลือ</th>
              <th>สถานะ</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <tbody id="ingredientRows">
            <tr><td colspan="6">กำลังโหลดข้อมูล...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </template>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    (async () => {
      const me = await initStaffPage({
        title: 'จัดการวัตถุดิบ',
        roles: ['manager', 'owner']
      });
      if (!me) return;

      const $ = (id) => document.getElementById(id);
      let ingredients = [];

      function render(rows) {
        const low = rows.filter(r => Number(r.qty_on_hand) <= Number(r.reorder_point));
        const normal = rows.length - low.length;

        $('lowCount').textContent = `ต้องสั่ง ${low.length} รายการ`;
        $('normalCount').textContent = `ปกติ ${normal} รายการ`;

        $('ingredientRows').innerHTML = rows.length
          ? rows.map(r => {
              const qty = Number(r.qty_on_hand);
              const point = Number(r.reorder_point);
              const isLow = qty <= point;
              const ratio = point > 0
                ? Math.max(0, Math.min(100, qty / point * 100))
                : (qty > 0 ? 100 : 0);

              return `
                <tr>
                  <td><strong>${fmt.esc(r.name)}</strong></td>
                  <td>${fmt.num(qty)} ${fmt.esc(r.unit)}</td>
                  <td>${fmt.num(point)} ${fmt.esc(r.unit)}</td>
                  <td>
                    <progress max="100" value="${ratio}" aria-label="ระดับคงเหลือ"></progress>
                    <div class="caption muted">${ratio.toFixed(0)}%</div>
                  </td>
                  <td>${isLow
                    ? badge('low', 'ต้องสั่ง')
                    : badge('active', 'ปกติ')}</td>
                  <td>
                    <div class="row">
                      <button class="btn btn-secondary btn-sm"
                        data-edit="${r.id}">แก้ไข</button>
                      <button class="btn btn-danger btn-sm"
                        data-disable="${r.id}">ปิดใช้งาน</button>
                    </div>
                  </td>
                </tr>`;
            }).join('')
          : `<tr><td colspan="6">
              <div class="empty">
                <div class="empty-icon"><i data-icon="leaf"></i></div>
                ไม่พบวัตถุดิบ
              </div>
            </td></tr>`;

        document.querySelectorAll('[data-edit]').forEach(btn => {
          btn.onclick = () => editIngredient(Number(btn.dataset.edit));
        });

        document.querySelectorAll('[data-disable]').forEach(btn => {
          btn.onclick = () => deactivateIngredient(Number(btn.dataset.disable));
        });
      }

      async function load() {
        const rows = await run(() => api.get('ingredients', {
          q: $('search').value.trim(),
          low_stock: $('lowOnly').checked ? 1 : undefined
        }));

        if (!rows) return;
        ingredients = rows;
        render(rows);
      }

      function openIngredientForm(item = null) {
        const editing = Boolean(item);
        const modal = openModal({
          title: editing ? 'แก้ไขวัตถุดิบ' : 'เพิ่มวัตถุดิบ',
          body: `
            <form id="ingredientForm">
              <div class="field">
                <label for="ingredientName">ชื่อวัตถุดิบ</label>
                <input class="input" id="ingredientName" required
                  maxlength="100" value="${fmt.esc(item?.name || '')}">
              </div>
              <div class="field">
                <label for="ingredientUnit">หน่วย</label>
                <input class="input" id="ingredientUnit" required
                  maxlength="20" placeholder="เช่น กิโลกรัม, ถุง, ขวด"
                  value="${fmt.esc(item?.unit || '')}">
              </div>
              <div class="field">
                <label for="reorderPoint">จุดสั่งซื้อซ้ำ</label>
                <input class="input" id="reorderPoint" type="number"
                  min="0" step="0.01" required
                  value="${item ? Number(item.reorder_point) : 0}">
              </div>
              <p class="caption muted">
                จำนวนคงเหลือจะเปลี่ยนจากระบบรับของและปรับสต็อก
              </p>
              <div class="row">
                <button type="submit" class="btn">
                  ${editing ? 'บันทึกการแก้ไข' : 'เพิ่มวัตถุดิบ'}
                </button>
                <button type="button" class="btn btn-secondary" data-close>
                  ยกเลิก
                </button>
              </div>
            </form>`
        });

        modal.el.querySelector('#ingredientForm').onsubmit = async (event) => {
          event.preventDefault();

          const body = {
            action: editing ? 'update' : 'create',
            name: $('ingredientName').value.trim(),
            unit: $('ingredientUnit').value.trim(),
            reorder_point: Number($('reorderPoint').value)
          };

          if (editing) body.id = item.id;

          const saved = await run(() => api.post('ingredients', body));
          if (saved) {
            modal.close();
            await load();
          }
        };
      }

      function editIngredient(id) {
        const item = ingredients.find(r => Number(r.id) === id);
        if (item) openIngredientForm(item);
      }

      async function deactivateIngredient(id) {
        const item = ingredients.find(r => Number(r.id) === id);
        if (!item) return;

        const confirmed = await confirmModal(
          `ต้องการปิดใช้งานวัตถุดิบ "${fmt.esc(item.name)}" หรือไม่?`,
          'ปิดใช้งาน',
          true
        );
        if (!confirmed) return;

        const result = await run(() => api.post('ingredients', {
          action: 'deactivate',
          id
        }));

        if (result) await load();
      }

      $('addBtn').onclick = () => openIngredientForm();
      $('refreshBtn').onclick = load;
      $('lowOnly').onchange = load;

      let searchTimer;
      $('search').oninput = () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(load, 250);
      };

      await load();
    })();
  </script>
</body>
</html>
