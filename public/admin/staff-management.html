<!doctype html>
<!-- จัดการพนักงาน (คนที่ 2 · เฟส 1 · UC-51) — เจ้าของร้านเท่านั้น -->
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>พนักงาน · นึ่งสุข</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="app"></div>

  <template id="page">
    <div class="toolbar">
      <div class="row" style="gap:8px">
        <input class="input" id="q" placeholder="ค้นหาชื่อ / ชื่อผู้ใช้ / เบอร์" style="width:240px">
        <select class="select" id="roleFilter" style="width:170px"><option value="all">ทุกบทบาท</option></select>
        <select class="select" id="statusFilter" style="width:140px">
          <option value="all">ทุกสถานะ</option>
          <option value="1">ใช้งาน</option>
          <option value="0">ปิดใช้งาน</option>
        </select>
      </div>
      <button class="btn" id="addBtn">+ เพิ่มพนักงาน</button>
    </div>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>ชื่อ-สกุล</th><th>ชื่อผู้ใช้</th><th>เบอร์โทร</th><th>บทบาท</th><th>สิทธิ์เพิ่มเติม</th><th>สถานะ</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="loading">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>
  </template>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    (async () => {
      const me = await initStaffPage({ title: 'พนักงาน', roles: ['owner'] });
      if (!me) return;

      const ROLE_KIND = { staff: 'off', head_chef: 'doing', manager: 'wait', owner: 'ok' };
      let list = [];
      let roleList = []; // จาก /api/roles (ตัด customer ออก)
      const roleById = (id) => roleList.find((r) => r.id === Number(id));

      const rows = document.getElementById('rows');
      const $ = (id) => document.getElementById(id);

      async function init() {
        const rl = await run(() => api.get('roles'));
        roleList = (rl || []).filter((r) => r.role_code !== 'customer');
        $('roleFilter').innerHTML += roleList.map((r) => `<option value="${r.id}">${fmt.esc(r.role_name)}</option>`).join('');
        load();
      }

      async function load() {
        const data = await run(() => api.get('users'));
        if (!data) return;
        list = data;
        draw();
      }

      function draw() {
        const q = $('q').value.trim();
        const rf = $('roleFilter').value;
        const sf = $('statusFilter').value;
        const shown = list.filter((u) =>
          (rf === 'all' || u.role_id === Number(rf)) &&
          (sf === 'all' || u.is_active === Number(sf)) &&
          (!q || u.full_name.includes(q) || u.username.includes(q) || (u.phone || '').includes(q)));

        rows.innerHTML = shown.length ? shown.map((u) => {
          const role = roleById(u.role_id) || {};
          const isMe = u.id === me.id;
          const perms = (u.can_payment ? '<span class="badge badge-ok">รับเงิน</span> ' : '')
            + (u.can_vip_booking ? '<span class="badge badge-ok">จอง VIP</span>' : '')
            + (!u.can_payment && !u.can_vip_booking ? '<span class="muted">–</span>' : '');
          const action = u.is_active
            ? `<button class="btn btn-danger btn-sm" data-off="${u.id}" ${isMe ? 'disabled title="ปิดบัญชีตัวเองไม่ได้"' : ''}>ปิดบัญชี</button>`
            : `<button class="btn btn-secondary btn-sm" data-on="${u.id}">เปิดบัญชี</button>`;
          return `<tr>
            <td class="bold">${fmt.esc(u.full_name)}${isMe ? ' <span class="muted">(คุณ)</span>' : ''}</td>
            <td>${fmt.esc(u.username)}</td><td>${fmt.esc(u.phone || '-')}</td>
            <td><span class="badge badge-${ROLE_KIND[role.role_code] || 'off'}">${fmt.esc(role.role_name || '-')}</span></td>
            <td>${perms}</td><td>${badge(u.is_active ? 'active' : 'inactive')}</td>
            <td><div class="row" style="gap:8px;flex-wrap:nowrap">
              <button class="btn btn-secondary btn-sm" data-edit="${u.id}">แก้ไข</button>${action}</div></td></tr>`;
        }).join('')
          : '<tr><td colspan="7"><div class="empty"><div class="empty-icon">👥</div>ไม่พบพนักงาน</div></td></tr>';

        rows.querySelectorAll('[data-edit]').forEach((b) => { b.onclick = () => openForm(list.find((x) => x.id === Number(b.dataset.edit))); });
        rows.querySelectorAll('[data-off]').forEach((b) => { b.onclick = () => toggle(Number(b.dataset.off), false); });
        rows.querySelectorAll('[data-on]').forEach((b) => { b.onclick = () => toggle(Number(b.dataset.on), true); });
      }

      async function toggle(id, on) {
        const u = list.find((x) => x.id === id);
        if (!on) {
          if (id === me.id) return;
          if (!(await confirmModal(`ปิดบัญชี ${fmt.esc(u.full_name)}? จะเข้าสู่ระบบไม่ได้จนกว่าจะเปิดบัญชีอีกครั้ง`, 'ปิดบัญชี', true))) return;
        }
        const done = await run(() => api.post('users', { action: on ? 'activate' : 'deactivate', id }));
        if (done !== null) load();
      }

      function openForm(u) {
        const editing = !!u;
        const roleOpts = roleList.map((r) =>
          `<option value="${r.id}" data-code="${r.role_code}" ${u && u.role_id === r.id ? 'selected' : ''}>${fmt.esc(r.role_name)}</option>`).join('');
        const m = openModal({
          title: editing ? 'แก้ไขพนักงาน' : 'เพิ่มพนักงาน',
          body: `
            <div class="field"><label>ชื่อ-สกุล</label><input class="input" id="fName" maxlength="100" value="${fmt.esc(u ? u.full_name : '')}"></div>
            <div class="field"><label>ชื่อผู้ใช้</label><input class="input" id="fUser" maxlength="50" value="${fmt.esc(u ? u.username : '')}"></div>
            <div class="field"><label>รหัสผ่าน</label><input class="input" id="fPass" type="password" autocomplete="new-password"
              placeholder="${editing ? 'เว้นว่าง = ไม่เปลี่ยน' : 'อย่างน้อย 4 ตัวอักษร'}"></div>
            <div class="field"><label>เบอร์โทร</label><input class="input" id="fPhone" maxlength="20" value="${fmt.esc(u ? u.phone || '' : '')}" placeholder="เช่น 081-234-5678"></div>
            <div class="field"><label>บทบาท</label><select class="select" id="fRole">${roleOpts}</select></div>
            <div id="fPerms">
              <label class="row" style="gap:8px"><input type="checkbox" id="fPay" ${!u || u.can_payment ? 'checked' : ''}> รับเงิน</label>
              <label class="row" style="gap:8px"><input type="checkbox" id="fVip" ${!u || u.can_vip_booking ? 'checked' : ''}> จองห้อง VIP</label>
            </div>`,
          footer: '<button class="btn btn-secondary" data-close>ยกเลิก</button><button class="btn" data-save>บันทึก</button>',
        });
        const el = (id) => m.el.querySelector('#' + id);
        const roleCode = () => el('fRole').selectedOptions[0].dataset.code;
        const syncPerms = () => { el('fPerms').hidden = roleCode() !== 'staff'; };
        el('fRole').onchange = syncPerms;
        syncPerms();

        el('fRole').closest('.modal').querySelector('[data-save]').onclick = async () => {
          const name = el('fName').value.trim();
          const username = el('fUser').value.trim();
          const password = el('fPass').value;
          const phone = el('fPhone').value.trim();
          if (!name) return toast('กรุณากรอกชื่อ-สกุล', 'error');
          if (!username) return toast('กรุณากรอกชื่อผู้ใช้', 'error');
          if (!editing && password.length < 4) return toast('รหัสผ่านอย่างน้อย 4 ตัวอักษร', 'error');
          if (!/^0\d{1,2}-?\d{3}-?\d{4}$/.test(phone)) return toast('รูปแบบเบอร์ไม่ถูกต้อง เช่น 081-234-5678', 'error');

          const code = roleCode();
          const payload = {
            username, full_name: name, phone, role_id: Number(el('fRole').value),
            can_payment: 1, can_vip_booking: 1,
          };
          if (code === 'staff') { payload.can_payment = el('fPay').checked ? 1 : 0; payload.can_vip_booking = el('fVip').checked ? 1 : 0; }
          else if (code === 'head_chef') { payload.can_payment = 0; payload.can_vip_booking = 0; }
          if (password) payload.password = password;

          const done = await run(() => api.post('users', { action: editing ? 'update' : 'create', ...(editing ? { id: u.id } : {}), ...payload }));
          if (done !== null) { m.close(); load(); }
        };
      }

      $('addBtn').onclick = () => openForm(null);
      ['q', 'roleFilter', 'statusFilter'].forEach((id) => $(id).addEventListener('input', draw));
      init();
    })();
  </script>
</body>
</html>
