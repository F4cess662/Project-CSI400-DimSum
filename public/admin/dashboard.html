<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · นึ่งสุข</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="app"></div>

  <template id="page">
    <div class="toolbar">
      <div class="small muted" id="updatedAt">กำลังโหลด...</div>
      <button class="btn btn-secondary btn-sm" id="refreshBtn">↻ รีเฟรช</button>
    </div>

    <div class="alert alert-bad hidden" id="loadError" style="margin-bottom:16px"></div>

    <!-- ตัวเลขสรุป 4 ใบ -->
    <div class="grid grid-4 section">
      <div class="card stat">
        <div class="stat-icon">🪑</div>
        <div><div class="stat-value" id="statTables">-</div><div class="stat-label">โต๊ะมีลูกค้า</div></div>
      </div>
      <div class="card stat">
        <div class="stat-icon">👑</div>
        <div><div class="stat-value" id="statVip">-</div><div class="stat-label">ห้อง VIP มีลูกค้า</div></div>
      </div>
      <div class="card stat">
        <div class="stat-icon">🧾</div>
        <div><div class="stat-value" id="statBills">-</div><div class="stat-label" id="statBillsSub">บิลที่เปิด</div></div>
      </div>
      <div class="card stat">
        <div class="stat-icon">🚫</div>
        <div><div class="stat-value" id="statMenus">-</div><div class="stat-label">เมนูขายไม่ได้</div></div>
      </div>
    </div>

    <!-- กราฟโต๊ะ -->
    <div class="grid grid-2 section">
      <div class="card">
        <div class="row-between">
          <h3 class="card-title">โต๊ะตอนนี้</h3>
          <a class="btn btn-ghost btn-sm" href="/admin/tables.html">ผังโต๊ะ →</a>
        </div>
        <div id="chartDonut"><div class="loading">กำลังโหลด...</div></div>
      </div>
      <div class="card">
        <h3 class="card-title">โต๊ะตามโซน</h3>
        <div id="chartZones"><div class="loading">กำลังโหลด...</div></div>
      </div>
    </div>

    <!-- สถานะเมนูวันนี้ ตามหมวด -->
    <div class="card section">
      <div class="row-between">
        <h3 class="card-title">สถานะเมนูวันนี้ ตามหมวด</h3>
        <a class="btn btn-ghost btn-sm" href="/admin/stock-today.html">จัดการ →</a>
      </div>
      <div class="row-between" style="margin-bottom:16px">
        <div class="bold" id="menuSummary">กำลังโหลด...</div>
        <div id="menuLegend"></div>
      </div>
      <div class="grid grid-3" id="menuCategories"></div>
      <div class="alert alert-bad hidden" id="soldoutAll" style="margin-top:16px"></div>
    </div>

    <!-- บิลรายชั่วโมง -->
    <div class="card section">
      <h3 class="card-title">บิลที่เปิดวันนี้ รายชั่วโมง</h3>
      <div id="chartHours"><div class="loading">กำลังโหลด...</div></div>
    </div>

    <!-- รายการย่อ -->
    <div class="grid grid-3 section">
      <div class="card">
        <div class="row-between">
          <h3 class="card-title">เมนูขายไม่ได้</h3>
          <a class="btn btn-ghost btn-sm" href="/admin/stock-today.html">จัดการ →</a>
        </div>
        <div id="menuList"><div class="loading">กำลังโหลด...</div></div>
      </div>
      <div class="card">
        <div class="row-between">
          <h3 class="card-title">พนักงาน</h3>
          <a class="btn btn-ghost btn-sm hidden" id="usersLink" href="/admin/staff-management.html">จัดการ →</a>
        </div>
        <div class="small muted" id="staffSummary" style="margin-bottom:8px"></div>
        <div id="staffList"><div class="loading">กำลังโหลด...</div></div>
      </div>
      <div class="card">
        <h3 class="card-title">เร็วๆ นี้</h3>
        <div class="empty" style="padding:16px">
          <div class="empty-icon">🥟</div>
          <div class="small">ยอดขายวันนี้ · เมนูใกล้หมด · ห้อง VIP วันนี้ · วัตถุดิบ</div>
        </div>
      </div>
    </div>
  </template>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
